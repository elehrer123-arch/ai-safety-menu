<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The AI Safety Menu</title>
<meta name="description" content="You have 213 days of lead over China. Spend them on AI safety.">
<meta property="og:title" content="The AI Safety Menu">
<meta property="og:description" content="You have 213 days of lead over China. Spend them on AI safety.">
<meta name="twitter:card" content="summary_large_image">
<meta property="og:image" content="https://elehrer123-arch.github.io/ai-safety-menu/og/default.png">
<meta property="og:url" content="https://elehrer123-arch.github.io/ai-safety-menu/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&family=Source+Serif+4:ital,opsz,wght@1,8..60,400&display=swap">
<style>
:root{
  --paper:#F6F3EC; --paper-2:#ECE7DC; --card:#FFFFFF; --ink:#1B1A17; --ink-2:#55514A; --ink-3:#8A857B; --rule:#DDD6C8;
  --cost:#C0392B; --gain:#1E7A45; --free:#8A857B; --risk:#6B4FA0; --track:#E4DED0;
  --t-free:#E3EBDD; --t-release:#F6E3B4; --t-train:#F4D0C8; --t-china:#D3E2F2;
  --d-free:#3F6B45; --d-release:#8A5A00; --d-train:#A3281E; --d-china:#1F4E86;
  --bar:#1B1A17; --bar-ink:#F6F3EC; --bar-2:#A39E92; --road:#3A3730; --road-line:#6E685D;
  --us:#2B4C8C; --us-ink:#FFFFFF; --cn:#C8261D; --cn-ink:#F7D046;
  --accent:#C0392B; --accent-ink:#FFFFFF; --tilemix:100%;
  --receipt:#FFFFFF; --receipt-ink:#141414;
  --shadow:0 1px 2px rgba(0,0,0,.06), 0 8px 22px rgba(0,0,0,.07);
  --display:"Big Shoulders Display",Impact,"Arial Narrow",sans-serif;
  --sans:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",Menlo,Consolas,monospace;
  --serif:"Source Serif 4",Georgia,serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141613; --paper-2:#1C1F1B; --card:#20241F; --ink:#EEEAE0; --ink-2:#BEB8AB; --ink-3:#8C877C; --rule:#343831;
    --cost:#F0796B; --gain:#6FCB8F; --free:#8C877C; --risk:#B9A3F0; --track:#57534B;
    --t-free:#2A3A2C; --t-release:#43381B; --t-train:#4A2723; --t-china:#1F3247;
    --d-free:#A8D3AE; --d-release:#F1CD73; --d-train:#F4A195; --d-china:#9CC3EE;
    --bar:#0B0C0A; --bar-ink:#EEEAE0; --bar-2:#8C877C; --road:#2A2D28; --road-line:#4E534B;
    --us:#5B82CF; --cn:#E0463B; --accent:#F0796B; --accent-ink:#141613; --tilemix:32%;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --paper:#141613; --paper-2:#1C1F1B; --card:#20241F; --ink:#EEEAE0; --ink-2:#BEB8AB; --ink-3:#8C877C; --rule:#343831;
  --cost:#F0796B; --gain:#6FCB8F; --free:#8C877C; --risk:#B9A3F0; --track:#57534B;
  --t-free:#2A3A2C; --t-release:#43381B; --t-train:#4A2723; --t-china:#1F3247;
  --d-free:#A8D3AE; --d-release:#F1CD73; --d-train:#F4A195; --d-china:#9CC3EE;
  --bar:#0B0C0A; --bar-ink:#EEEAE0; --bar-2:#8C877C; --road:#2A2D28; --road-line:#4E534B;
  --us:#5B82CF; --cn:#E0463B; --accent:#F0796B; --accent-ink:#141613; --tilemix:32%;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--paper);color:var(--ink)}
body{margin:0;font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:900;line-height:1;margin:0;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.wrap{max-width:1120px;margin:0 auto;padding-inline:20px}
@media (max-width:480px){.wrap{padding-inline:16px}}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.cost{color:var(--cost)}.gain{color:var(--gain)}.free{color:var(--free)}
.muted{color:var(--ink-3);font-size:.88rem}

/* header + hero + balance */
.top{background:var(--card);border-bottom:1px solid var(--rule)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px}
.brand{font-family:var(--display);font-weight:900;font-size:1.5rem;text-transform:uppercase;text-decoration:none;line-height:1}
.brand span{color:var(--accent)}
.toplink{font-weight:600;font-size:.92rem;color:var(--ink-2);text-decoration:none}
.toplink:hover{color:var(--ink)}
.hero{background:var(--card)}
.hero-in{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding-block:30px 28px}
.hero-ico{width:112px;height:112px;border-radius:50%;background:var(--paper-2);display:grid;place-items:center}
.hero-ico svg{width:84px;height:84px}
.hero h1{font-size:clamp(2.4rem,6.4vw,3.8rem)}
.hero p{margin:0;color:var(--ink-2);font-size:1.05rem;max-width:44em;text-wrap:balance}
.bal{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--us);color:#fff;transition:background .35s}
.bal.up{background:#1E7A45}.bal.down{background:#A3281E}
.bal .wrap{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding-block:14px}
.bal-c{display:flex;align-items:baseline;justify-content:center;gap:10px;flex-wrap:wrap}
.bal-v{font-family:var(--display);font-weight:900;font-size:clamp(2.3rem,5.4vw,3.2rem);line-height:1;font-variant-numeric:tabular-nums}
.bal-s{font-weight:600;font-size:1.02rem;opacity:.9}
#balR{justify-self:end}
.bal-btn{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:.88rem;text-decoration:none;border:1.5px solid rgba(255,255,255,.65);border-radius:999px;padding:6px 14px;color:#fff;background:none;white-space:nowrap}
@media (max-width:640px){.bal .wrap{grid-template-columns:1fr;padding-block:10px}.bal .wrap>span:first-child{display:none}.bal-s{font-size:.9rem}#balR{display:none}}
.meter{height:12px;background:rgba(255,255,255,.25);border-radius:999px;overflow:hidden}
.meter i{display:block;height:100%;background:#fff;border-radius:999px;transition:width .4s}

/* race */
.race{position:relative;height:34px}
.race .road{position:absolute;left:0;right:0;top:12px;height:10px;border-radius:999px;background:var(--road)}
.race .road::after{content:"";position:absolute;left:8px;right:8px;top:4px;height:2px;background:repeating-linear-gradient(90deg,var(--road-line) 0 8px,transparent 8px 16px)}
.race .rn{position:absolute;top:3px;width:28px;height:28px;margin-left:-14px;border-radius:50%;display:grid;place-items:center;font-size:.64rem;font-weight:700;letter-spacing:.02em;transition:left .6s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 0 2px var(--bar)}
.race .rn.us{background:var(--us);color:var(--us-ink);z-index:2}
.race .rn.cn{background:var(--cn);color:var(--cn-ink);z-index:1}
.race .rn.ghost{background:transparent;border:2px dashed var(--bar-2);box-shadow:none;opacity:.6}
@media (prefers-reduced-motion:reduce){.race .rn,.meter i,.bal-v{transition:none}}

/* layout */
main{padding-block:26px 72px;min-width:0}
.head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:10px 20px;margin-bottom:14px}
.head h1{font-size:clamp(1.9rem,4.4vw,3rem)}
.head p{margin:6px 0 0;color:var(--ink-2);max-width:52ch}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* worldview */
.wv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 16px;align-items:center;background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:10px 12px;margin:0 0 14px}
.wv-q{font-weight:600;font-size:.9rem;max-width:15em;line-height:1.25}
.wv-q button{background:none;border:0;padding:0;color:var(--ink-3);text-decoration:underline;font-size:.8rem;font-weight:500}
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:var(--paper-2);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;border-radius:8px;padding:6px 6px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.78rem;font-weight:600;color:var(--ink-2);line-height:1.15;text-align:center}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.pips{display:flex;gap:3px}
.pips i{width:9px;height:9px;border-radius:2px;background:var(--rule)}
.pips i.f{background:var(--cn)}
@media (max-width:640px){.wv{grid-template-columns:1fr}.wv-q{max-width:none}.seg button{font-size:.7rem}}

/* famous orders */
.lbl{font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:18px 0 8px}

/* legend */
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.8rem;color:var(--ink-2);margin:4px 0 10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px}

/* rigor details (detail and backup pages only) */
.facts{background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:14px 18px;margin-top:12px}
.facts p{margin:8px 0 0;max-width:70ch}
.basis{font-size:.74rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 10px}
.b-partial{background:var(--t-free);color:var(--d-free)}.b-estimate{background:var(--t-release);color:var(--d-release)}
.alts{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;margin-top:8px;font-size:.88rem}
.alt{background:var(--paper-2);border-radius:8px;padding:2px 8px}.alt.on{outline:2px solid var(--us)}
.sec2{font-size:.72rem;font-weight:700;background:var(--t-release);color:var(--d-release);border-radius:6px;padding:1px 6px}
ul.plain{margin:8px 0 0;padding-left:20px}ul.plain li{margin-bottom:6px;color:var(--ink-2)}
.per{display:block;font-family:var(--sans);font-weight:600;font-size:.7rem;color:var(--ink-3);letter-spacing:.02em}
/* illustrations */
.art{display:grid;place-items:center;background:color-mix(in srgb, var(--tb, var(--paper-2)) var(--tilemix), var(--card));border-radius:12px;color:var(--us)}
.art svg{width:64%;height:64%}
.art.hd{width:96px;height:96px;border-radius:20px}.art.hd svg{width:72px;height:72px}
.art.wide{height:150px;border-radius:0}.art.wide svg{width:110px;height:110px}
.art.sm{width:60px;height:60px;flex:none;border-radius:14px}.art.sm svg{width:44px;height:44px}
.art.xs{width:26px;height:26px;border-radius:7px;margin-left:-6px}.art.xs svg{width:22px;height:22px}
.face{position:relative;display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--paper);overflow:hidden;flex:none;font-weight:700;font-size:.8rem}
.face::before{content:attr(data-ini)}
.face img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.face.lg{width:76px;height:76px;font-size:1.2rem;margin-bottom:14px}
/* items */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
@media (max-width:560px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.item{position:relative;background:var(--card);border-radius:14px;padding:0 14px 14px;overflow:hidden;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;border:2px solid transparent;box-shadow:var(--shadow);min-width:0}
.item.on{border-color:var(--us)}
.item>.art{height:132px;margin:0 -14px 12px;border-radius:0;align-self:stretch}.item>.art svg{width:92px;height:92px}
.item.on>.art{box-shadow:inset 0 -4px 0 var(--us)}
.iname{font-weight:700;font-size:1.06rem;line-height:1.2;min-height:2.4em;display:flex;align-items:center;justify-content:center}
.iprice{font-family:var(--display);font-weight:900;font-size:1.55rem;line-height:1.1;color:var(--us)}
.iprice.gain{color:var(--gain)}
.ibtns{display:grid;grid-template-columns:1fr 1.25fr;gap:8px;width:100%;margin-top:12px}
.ibtns button{border:0;border-radius:8px;padding:10px 4px;font-weight:700;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b-rm{background:var(--paper-2);color:var(--ink-3)}
.b-rm:not([disabled]){background:#F2D3CE;color:#8A2219}
.b-add{background:var(--us);color:#fff}
.b-add[disabled]{background:var(--paper-2);color:var(--ink-2)}
.ibtns button[disabled]{cursor:default}
.info{position:absolute;top:10px;right:10px;z-index:1;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.9);color:#1B1A17!important;color:var(--ink-2);display:grid;place-items:center;text-decoration:none;font-family:var(--serif);font-style:italic;font-weight:600;font-size:.92rem}
.info:hover{background:var(--ink);color:var(--paper)}
@media (max-width:560px){.item{padding:0 10px 10px}.item>.art{height:104px;margin:0 -10px 10px}.item>.art svg{width:72px;height:72px}.ico{width:64px;height:64px}.ico svg{width:32px;height:32px}.iname{font-size:.94rem}.iprice{font-size:1.3rem}.ibtns{gap:6px}.ibtns button{font-size:.82rem;padding:9px 2px}}
.sec{font-size:clamp(1.5rem,3.4vw,2rem);text-align:center;margin:44px 0 4px}
.sub{text-align:center;color:var(--ink-3);margin:0 0 16px}
.more{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:14px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:.95rem;padding:10px 18px;border-radius:999px;border:1.5px solid var(--ink);background:transparent;text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.dark{background:var(--ink);color:var(--paper)}
.btn[disabled]{opacity:.4;cursor:default}
.links{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:12px;font-size:.88rem}
.links a,.links button{background:none;border:0;padding:0;color:var(--ink-2);text-decoration:underline;font-weight:500}

/* bar rows (charts) */
.bars{display:grid;gap:4px}
.br{display:grid;grid-template-columns:minmax(0,15em) minmax(0,1fr) 5.5em;gap:10px;align-items:center;min-height:26px}
.br .l{font-size:.86rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:none}
a.l:hover{text-decoration:underline}
.br .p{position:relative;height:18px}
.br .z{position:absolute;top:-4px;bottom:-4px;width:1.5px;background:var(--ink-3)}
.br .b{position:absolute;top:3px;height:12px;border-radius:3px;transition:left .5s,width .5s}
.br .b.cost{background:var(--cost)}.br .b.gain{background:var(--gain)}.br .b.ink{background:var(--ink)}.br .b.soft{background:var(--ink-3)}
.br .b.gap{background:var(--us)}.br .b.eval{background:var(--d-release)}.br .b.pace{background:var(--ink-3)}
.br .b.mkt{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.5) 0 3px,transparent 3px 6px)}
.br .d{position:absolute;top:2px;width:14px;height:14px;margin-left:-7px;border-radius:50%;transition:left .5s}
.br .d.me{background:var(--ink)}.br .d.them{background:var(--card);border:2.5px solid var(--cn)}
.br .ln{position:absolute;top:8px;height:2px;background:var(--ink-3);transition:left .5s,width .5s}
.br .v{font-family:var(--display);font-weight:900;font-size:1.05rem;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.br.hl .l{color:var(--ink)}.br.hl{background:var(--paper-2);border-radius:6px}
.br.tot .l{font-weight:700}.br.tot{border-top:1.5px solid var(--ink);padding-top:4px;margin-top:2px}
.bars.wide .br{grid-template-columns:minmax(0,14em) minmax(0,1fr) 9.5em}
@media (max-width:560px){.br{grid-template-columns:minmax(0,9.5em) minmax(0,1fr) 4.6em;gap:6px}.br .l{font-size:.78rem}.bars.wide .br{grid-template-columns:minmax(0,7.5em) minmax(0,1fr) 7.4em}.bars.wide .br .v{font-size:.88rem}}
.axis{display:flex;justify-content:space-between;font-size:.72rem;font-weight:600;color:var(--ink-3);margin:2px 0 6px}

/* detail */
.dt{max-width:860px}
.back{font-size:.88rem;font-weight:600;color:var(--ink-2);text-decoration:none}
.dhead{display:grid;grid-template-columns:96px minmax(0,1fr);gap:18px;align-items:center;margin:14px 0 18px}
.dhead .art.hd{margin:0}
.dhead h1{font-size:clamp(1.8rem,4.4vw,2.8rem)}
.dhead p{margin:6px 0 0;color:var(--ink-2)}
@media (max-width:520px){.dhead .art.hd{width:64px;height:64px;border-radius:14px}.dhead .art.hd svg{width:48px;height:48px}.dhead{grid-template-columns:64px minmax(0,1fr);gap:12px}.dhead .tile{height:64px;border-radius:14px}.dhead .tile svg{width:32px;height:32px}}
.big{display:flex;flex-wrap:wrap;align-items:end;gap:10px 24px;padding:18px 20px;background:var(--card);border:1px solid var(--rule);border-radius:16px}
.big .n{font-family:var(--display);font-weight:900;font-size:clamp(3rem,9vw,4.6rem);line-height:.85}
.big .s{color:var(--ink-2);font-size:.92rem;padding-bottom:4px}
.big .s b{display:block;color:var(--ink);font-size:1rem}
.panel{background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:16px 18px;margin-top:14px}
.panel h3{font-size:1.1rem;margin-bottom:10px;letter-spacing:.03em}
.clocks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.clk{border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.clk svg{width:26px;height:26px}
.clk b{font-size:.84rem}
.clk span{font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.clk.yes{background:var(--t-train);color:var(--d-train)}.clk.cond{background:var(--t-release);color:var(--d-release)}.clk.no{background:var(--t-free);color:var(--d-free)}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:720px){.twocol{grid-template-columns:1fr}}
details.acc{border-top:1px solid var(--rule);padding:12px 0}
.lead{font-size:1.12rem;line-height:1.55;margin:0;max-width:66ch}
details.seemore{margin-top:16px}
details.seemore>summary{list-style:none;cursor:pointer;display:flex;width:fit-content;align-items:center;gap:8px;font-weight:700;padding:10px 18px;border-radius:999px;border:1.5px solid var(--ink)}
details.seemore>summary::-webkit-details-marker{display:none}
details.seemore>summary::after{content:"↓";font-weight:400}
details.seemore[open]>summary::after{content:"↑"}
details.seemore[open]>summary{margin-bottom:6px}
.more-in h3{font-size:1.15rem;margin:22px 0 8px;letter-spacing:.03em}
.more-in p,.more-in li{color:var(--ink-2);max-width:68ch}
.more-in ul,.more-in ol{padding-left:20px}
.more-in a{word-break:break-word}
ul.who{list-style:none;padding:0}
ul.who li{padding:8px 0;border-bottom:1px solid var(--rule)}
ul.who b{color:var(--ink)}
details.acc:last-of-type{border-bottom:1px solid var(--rule)}
details.acc summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::after{content:"+";font-weight:400;font-size:1.3rem;line-height:1;color:var(--ink-3)}
details.acc[open] summary::after{content:"–"}
details.acc p,details.acc li{max-width:68ch;color:var(--ink-2)}
details.acc ul,details.acc ol{padding-left:20px}
details.acc a{word-break:break-word}

/* quotes */
@media (max-width:640px){.qbig{grid-template-columns:1fr}}

/* games */
.dots{display:flex;gap:6px;margin-bottom:12px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--rule)}
.dots i.ok{background:var(--gain)}.dots i.no{background:var(--cost)}.dots i.cur{background:var(--ink)}

<script>
(function(){

const DPM = 30.44, Z = {low:0,central:0,high:0};
const REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const defaultLam = (D.stances.find(s=>s.id===D.default_stance)||{lam:.5}).lam;
const SHORT = { own:'Not at all', some:'A little', lot:'A lot', most:'Mostly' };
const RK = window.MENU_RISK, HARMS = D.risk.harms;

/* ---------- state ---------- */
const SORTS = { shuffle: 'Shuffled', cost: 'Cheapest first', risk: 'Biggest risk cut', value: 'Most risk cut per day of lead', az: 'A to Z' };
const S = { lam: defaultLam, lead: 7, cart: [], name: '', hook: null, onboarded: false, pd: D.risk.default_baseline, harm: null, my: {}, sort: 'shuffle', q: '', kn: {}, pw: null, bills: false };
function load(k, d){ try{ const v = localStorage.getItem('menu2.'+k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } }

(function(){ const c = load('cart', []); if(Array.isArray(c)) S.cart = c.filter(byId);

  const my = load('my', {}); if(my && typeof my === 'object') Object.keys(my).forEach(id => { const p = byId(id); if(p && !p.components) S.my[id] = Object.assign({}, my[id]); });
  const kn = load('kn', {}); if(kn && typeof kn === 'object') Object.keys(kn).forEach(id => { if(byId(id)) S.kn[id] = kn[id]; });
  const pw = load('pw', null); if(pw && typeof pw === 'object') S.pw = pw; S.bills = !!load('bills', false);

function save(){ store('bills',S.bills); store('kn',S.kn); store('pw',S.pw); store('sort',S.sort); store('my',S.my); store('pd',S.pd); store('harm',S.harm); store('cart',S.cart); store('lam',S.lam); store('lead',S.lead); store('name',S.name); store('onboarded',S.onboarded); }

/* ---------- pricing ---------- */
// Cost to America's lead = delay to U.S. frontier − share copied × delay to China's access − direct slowdown to China
/* ---------- personal numbers ----------

const LEAD_S = [{l:'Gains months', d:-60},{l:'Gains weeks', d:-14},{l:'Gains days', d:-3},{l:'Under a day', d:0.3},{l:'Days', d:4},{l:'Weeks', d:21},{l:'1–2 months', d:45},{l:'3+ months', d:120}];
const RISK_S = [{l:'Raises it a lot', r:-0.10},{l:'Raises it', r:-0.03},{l:'No effect', r:0},{l:'Tiny', r:0.01},{l:'Small', r:0.03},{l:'Medium', r:0.07},{l:'Large', r:0.15},{l:'Huge', r:0.35}];
const leadIdx = m => { const d = m*DPM; return d <= -30 ? 0 : d <= -7 ? 1 : d <= -0.95 ? 2 : d < 0.95 ? 3 : d < 14.5 ? 4 : d < 30 ? 5 : d < 75 ? 6 : 7; };
const riskIdx = r => r <= -0.06 ? 0 : r <= -0.005 ? 1 : r < 0.005 ? 2 : r < 0.02 ? 3 : r < 0.05 ? 4 : r < 0.1 ? 5 : r < 0.25 ? 6 : 7;
// Numbers saved by v8.0 were steps; turn them into exact values once.
Object.keys(S.my).forEach(id => { const p = byId(id), m = S.my[id]; if(m.l == null && m.r == null) return;
  if(m.l != null && m.ld == null && m.l !== leadIdx(menuNet(p, S.lam).central)) m.ld = LEAD_S[m.l].d; if(m.r != null && m.rr == null && p.risk && m.r !== riskIdx(p.risk.central)) m.rr = RISK_S[m.r].r; delete m.l; delete m.r; });
const SL = { ld: { neg: 180, pos: 365, snap: d => Math.abs(d) < 0.05 ? 0 : Math.abs(d) < 10 ? Math.round(d*10)/10 : Math.round(d) },
             rr: { neg: 30, pos: 60, snap: v => Math.abs(v) < 0.05 ? 0 : Math.abs(v) < 10 ? Math.round(v*10)/10 : Math.round(v) } }; // rr slider works in percent
const slTo = (k, t) => { const c = SL[k], M = t < 0 ? c.neg : c.pos, v = Math.sign(t)*(Math.exp(Math.abs(t)/1000*Math.log(1+M)) - 1); return c.snap(Math.abs(t) < 12 ? 0 : v); };
const slFrom = (k, v) => { const c = SL[k], M = v < 0 ? c.neg : c.pos; return Math.max(-1000, Math.min(1000, Math.round(Math.sign(v)*1000*Math.log(1+Math.abs(v))/Math.log(1+M)))); };
const leadPhrase = m => m < -EPS ? 'gains '+lc(words(m))+' of lead' : m <= EPS ? 'costs no lead' : 'costs '+lc(words(m))+' of lead';
const riskPhrase = r => r > 0.0005 ? 'removes about '+RK.pct(r)+' of the risk' : r < -0.0005 ? 'adds about '+RK.pct(r)+' to the risk' : 'does nothing for p(doom)';
let OVR = null; // someone else's numbers while rendering their shared results
const myMap = () => OVR || S.my;
function myLead(p, lam){ const m = myMap()[p.id]; return (!m || m.ld == null || p.components) ? null : m.ld/DPM; }
function myRiskOv(){ const o = {}, mm = myMap(); Object.keys(mm).forEach(id => { const m = mm[id], p = byId(id); if(p && p.risk && m.rr != null) o[id] = m.rr; }); return o; }
/* ---------- assumption knobs ----------
   Modeled rules: the simulation model's three most influential inputs, precomputed on a 7x7x7 grid (src/knobs.js)
   and interpolated here; results shift the menu's estimate by the model's change. Hand-priced rules: the parts of
   our estimate. p(doom): each rule's cut = how much risk it targets x how well it works x how likely it is followed. */
const KT = window.MENU_KNOBS || {};
let KOVR = null; // someone else's knobs while rendering their shared results
const knMap = () => KOVR ? KOVR.kn : S.kn;
const pwMap = () => KOVR ? KOVR.pw : S.pw;
function handKnobs(p){ const ks = [];
  const mk = (key, label, o, scale) => { if(!o) return; const lo = o.low*DPM*scale, c = o.central*DPM*scale, hi = o.high*DPM*scale; if(Math.abs(hi-lo) < 0.05) return;
    ks.push({ name: key, label, fmt: key, values: [lo, lo+(c-lo)/3, lo+2*(c-lo)/3, c, c+(hi-c)/3, c+2*(hi-c)/3, hi], default: 3, evidence: 'our estimate', why: '' }); };
  mk('us', 'How much it changes U.S. progress', p.d_us, 1);
  if(p.d_china && (p.d_china.low || p.d_china.high)) mk('cn', 'How much it changes China\'s progress directly', p.d_china, 1);
  if(p.d_access && (p.d_access.low || p.d_access.high)) mk('acc', 'How much China loses through its reliance on U.S. models, at "a little"', p.d_access, 0.25);
  return ks; }
const knobsFor = p => p.components ? [] : KT[p.id] ? KT[p.id].knobs : handKnobs(p);
const knobPos = (p, ks) => { const k = (knMap()[p.id] || {}).k || []; return ks.map((x, i) => k[i] != null ? Math.max(0, Math.min(6, k[i])) : x.default); };
const valueAt = (x, pos) => { const b = Math.min(5, Math.floor(pos)), f = pos - b; return x.values[b] + (x.values[b+1] - x.values[b]) * f; };
function interp(tab, pos){ const n = pos.length, base = pos.map(x => Math.min(5, Math.floor(x))), fr = pos.map((x, i) => x - base[i]); let acc = 0;
  for(let m = 0; m < (1 << n); m++){ let w = 1, idx = 0; for(let i = 0; i < n; i++){ const b = (m >> i) & 1; w *= b ? fr[i] : 1 - fr[i]; idx = idx*7 + base[i] + b; } if(w) acc += w*tab[idx]; }
  return acc; }
const knobsChanged = p => { const k = (knMap()[p.id] || {}).k; if(!k) return false; const ks = knobsFor(p); return k.some((v, i) => v != null && ks[i] && Math.abs(v - ks[i].default) > 0.05); };
// Change in days to U.S. loss, China's direct loss and China's loss through U.S. models, from this rule's knobs.
function leadDelta(p){
  if(p.components){ let d = null; p.components.map(byId).filter(Boolean).forEach(c => { const x = leadDelta(c); if(x){ d = d || { us: 0, direct: 0, diff: 0 }; d.us += x.us; d.direct += x.direct; d.diff += x.diff; } }); return d; }
  if(!knobsChanged(p)) return null; const ks = knobsFor(p); if(!ks.length) return null; const pos = knobPos(p, ks);
  if(KT[p.id]){ const t = KT[p.id], def = ks.map(x => x.default); return { us: interp(t.us, pos) - interp(t.us, def), direct: interp(t.direct, pos) - interp(t.direct, def), diff: interp(t.diff, pos) - interp(t.diff, def) }; }
  const d = { us: 0, direct: 0, diff: 0 }; ks.forEach((x, i) => { const v = valueAt(x, pos[i]) - x.values[x.default]; if(x.name === 'us') d.us = v; else if(x.name === 'cn') d.direct = v; else d.diff = v; }); return d; }
const shift = (o, v) => ({ low: o.low + v, central: o.central + v, high: o.high + v });
function comp(p){ const d = leadDelta(p); if(!d) return p; return Object.assign({}, p, { d_us: shift(p.d_us, d.us/DPM), d_china: shift(p.d_china || Z, d.direct/DPM), d_access: shift(p.d_access, d.diff/0.25/DPM) }); }
// p(doom) knobs
const PW0 = Object.fromEntries(D.risk.pathways.map(x => [x.id, x.weight]));
function weights(){ const pw = pwMap(); if(!pw) return PW0; const raw = D.risk.pathways.map(x => Math.max(0, pw[x.id] != null ? pw[x.id] : x.weight*100)), tot = raw.reduce((a,b) => a+b, 0) || 1; return Object.fromEntries(D.risk.pathways.map((x, i) => [x.id, raw[i]/tot])); }
const targetShare = (tg, w) => Object.keys(tg).reduce((a, k) => a + (w[k]||0)*tg[k], 0);
const worksDefault = r => Math.min(1, Math.abs(r.central) / Math.max(1e-9, targetShare(r.targets, PW0)*r.adherence));
function riskKnobs(p){ const r = p.risk; if(!r || !r.targets || !r.central) return null; const k = knMap()[p.id] || {}, w = weights();
  const e = k.e != null ? k.e : worksDefault(r), a = k.a != null ? k.a : r.adherence; return { e, a, T: targetShare(r.targets, w), val: Math.sign(r.central)*targetShare(r.targets, w)*e*a }; }
function myRiskAdj(){ const o = {}, kn = knMap(), custom = !!pwMap(); D.policies.forEach(p => { const r = p.risk; if(!r || !r.targets || !r.central) return; const k = kn[p.id] || {};
  if(!custom && k.e == null && k.a == null) return; o[p.id] = riskKnobs(p).val / r.central; }); return o; }
const riskKnobsChanged = p => { const k = knMap()[p.id] || {}, r = p.risk; if(!r || !r.targets || !r.central) return false; return (k.e != null && Math.abs(k.e - worksDefault(r)) > 0.005) || (k.a != null && Math.abs(k.a - r.adherence) > 0.005); };
const hasMine = p => { if(p.components) return { l: false, r: false }; const m = myMap()[p.id] || {}; return { l: m.ld != null || knobsChanged(p), r: m.rr != null || riskKnobsChanged(p) }; };
const mineCount = () => [...new Set(Object.keys(myMap()).concat(Object.keys(knMap())))].filter(id => { const p = byId(id), h = p ? hasMine(p) : {}; return h.l || h.r; }).length;
function net(p, lam){ const o = myLead(p, lam); return o != null ? { low: o, central: o, high: o } : netRaw(p, lam); }
// The estimate after the player's assumption changes (before any direct override).
function netRaw(p, lam){ return netOf(comp(p), lam); }
function menuNet(p, lam){ return netOf(p, lam); }
function netOf(p, lam){ const u=p.d_us, a=p.d_access, c=p.d_china||Z; return { low: u.low - lam*a.high - c.high, central: u.central - lam*a.central - c.central, high: u.high - lam*a.low - c.low }; }
function totals(ids, lam){ const t = {gross:0,disc:0,credit:0,net:0,low:0,high:0}; ids.map(byId).filter(Boolean).map(comp).forEach(p => { const o = myLead(p, lam); if(o != null){ t.gross += o; t.low += o; t.high += o; return; } t.gross += p.d_us.central; t.disc += lam*p.d_access.central; t.credit += (p.d_china||Z).central; const n = netOf(p,lam); t.low += n.low; t.high += n.high; }); // Security measures share one theft budget, so ordering several cannot remove more theft risk than exists.
  const th = ids.map(byId).filter(p => p && p.theft_cut && myLead(p, lam) == null).map(comp);
  if(th.length > 1 && D.theft_pool){ const left = th.reduce((a,p) => a*(1-p.theft_cut), 1), P = D.theft_pool;
    const over = k => th.reduce((a,p) => a + p.d_china[k], 0) - P[k]*(1-left);
    t.credit -= over('central'); t.low += over('high'); t.high += over('low'); }
  t.net = t.gross - t.disc - t.credit; return t; }
function fmt(m){ if(m==null||isNaN(m)) return '—'; const v = Math.abs(m), d = v*DPM; let s;
  if(v < EPS) s = '0'; else if(d < 0.95) s = '<1 day'; else if(Math.round(d) <= 14){ const n = Math.max(1, Math.round(d)); s = n + (n===1?' day':' days'); }
  else if(v < 0.95) s = Math.round(d/7) + ' wks';
  else { const mo = Math.round(v*2)/2; s = (mo%1?mo.toFixed(1):mo) + ' mo'; }
  return (m < -EPS ? '−' : '') + s; }
// Effect on the lead: a cost shrinks it (−), a gain grows it (+)
const AP = D.appendix_base || '', EPS = 1e-6, UNDER = 1/DPM; // one day, in months
const eff = m => Math.abs(m) < EPS ? 'Free' : (m > 0 ? '−' + fmt(m) : '+' + fmt(-m));
const effCls = m => m > EPS ? 'cost' : m < -EPS ? 'gain' : 'free';
const nameOf = p => (D.short_names && D.short_names[p.id]) || p.name;
// Plain-words price: "Free", "Under a day", "3 days", "4 weeks", "1.5 months"; gains read "+4 weeks"
function wordsU(m){ const v = Math.abs(m), d = v*DPM;
  if(v < EPS) return 'Free';
  if(d < 0.95) return 'Under a day';
  if(Math.round(d) <= 14){ const n = Math.max(1, Math.round(d)); return n + (n===1?' day':' days'); }
  if(v < 0.95){ const w = Math.round(d/7); return w + ' weeks'; }
  const mo = Math.round(v*2)/2; return (mo%1?mo.toFixed(1):mo) + (mo===1?' month':' months'); }
const words = wordsU, lc = w => w.replace(/^Under/, 'under');
function rangeText(n){ const lo = n.low, hi = n.high, words = m => lc(wordsU(m));
  if(lo >= -EPS) return words(lo) === words(hi) ? words(lo) : (Math.abs(lo) < EPS ? 'nothing' : words(lo)) + ' to ' + words(hi);
  if(hi <= EPS) return words(hi) + ' to ' + words(lo) + ' gained';
  return 'anywhere from ' + words(lo) + ' gained to ' + words(hi) + ' lost'; }
const BASIS = { model: ['Modeled', 'From a simulation of U.S. and Chinese AI progress over the 12 months after a rule takes effect. Every input is published in the technical appendix; most are stated assumptions, not measurements.'], partial: ['Partly sourced', 'Built from published data, with our judgment connecting the data to days of lead.'], estimate: ['Our estimate', 'Our judgment, informed by the sources listed. No direct data measures this cost.'] };
function perText(){ return ''; } // every price is the effect 12 months after a rule takes effect
const priceText = (m, mkt) => m < -EPS ? (-m < UNDER*0.95 ? 'Gains under a day' : '+' + words(m)) : (mkt && m > EPS ? '~' : '') + words(m);
const days = m => Math.round(m*DPM);
const fmtDays = d => { const a = Math.abs(Math.round(d)); return a.toLocaleString('en-US') + (a===1?' day':' days'); };
const stanceOf = lam => D.stances.find(s => Math.abs(s.lam-lam) < 0.001) || null;
const stanceLabel = lam => { const s = stanceOf(lam); return s ? s.label : 'China depends on U.S. models: ' + (Math.round(lam/0.25*100)/100) + '× the model\'s central estimate'; };
/* ---------- p(doom) ---------- */
// Each rule removes a share of the remaining risk; see src/risk.js. p(doom) = starting estimate × (1 − share removed).
const P0 = pd => RK.baseline(D, pd||S.pd).p;
const riskOf = (p, k) => RK.one(p, D, k, myRiskOv(), myRiskAdj());
const cutOf = (ids, k) => RK.cut(ids, D, k, myRiskOv(), myRiskAdj());
const doomAfter = (ids, pd) => P0(pd) * (1 - cutOf(ids));

// Order-link format for personal numbers: CODE_leadTenthsOfADay_riskPerMille, entries joined by dots.
function myCode(mm){ return Object.keys(mm||{}).filter(id => D.codes[id] && (mm[id].ld != null || mm[id].rr != null)).map(id => D.codes[id]+'_'+(mm[id].ld==null?'':Math.round(mm[id].ld*10))+'_'+(mm[id].rr==null?'':Math.round(mm[id].rr*1000))).join('.'); }
// Knob settings in links: CODE_positions(tenths, dash-separated, blank = default)_works%_followed%; weights: seven whole numbers.
function knCode(kn){ return Object.keys(kn||{}).filter(id => D.codes[id]).map(id => { const k = kn[id] || {}, ps = (k.k || []).map(v => v == null ? '' : Math.round(v*10)).join('-');
  if(!ps.replace(/-/g,'') && k.e == null && k.a == null) return ''; return D.codes[id]+'_'+ps+'_'+(k.e == null ? '' : Math.round(k.e*100))+'_'+(k.a == null ? '' : Math.round(k.a*100)); }).filter(Boolean).join('.'); }
const pwCode = pw => pw ? D.risk.pathways.map(x => Math.round(pw[x.id] != null ? pw[x.id] : x.weight*100)).join('-') : '';
function payload(ids, lam, lead, name, pd, mm, kn, pw){ ids = ids||S.cart; lam = lam==null?S.lam:lam; lead = lead||S.lead; name = name==null?S.name:name; pd = pd||S.pd; mm = mm===undefined ? S.my : mm;
  kn = kn === undefined ? S.kn : kn; pw = pw === undefined ? S.pw : pw;
  const f = [ids.map(id=>D.codes[id]).join('.')||'-', Math.round(lam*100), lead, encodeURIComponent(name||''), pd, myCode(mm)], kc = knCode(kn), pc = pwCode(pw);
  if(kc || pc) f.push(kc, pc); return f.join('~'); }
function cleanName(s){ return String(s||'').replace(/[^\p{L}\p{N} .'\-]/gu,'').replace(/\s+/g,' ').trim().slice(0,24); }
function parsePayload(s){ const [c,l,m,n,d,y,kk,ww] = String(s||'').split('~');
  const ids = (c && c!=='-') ? c.split('.').map(x=>FROM_CODE[x]).filter(Boolean) : [];
  let lam = parseInt(l,10); lam = isNaN(lam) ? S.lam : Math.min(100,Math.max(0,lam))/100;
  let lead = parseInt(m,10); lead = isNaN(lead) ? 7 : Math.min(18,Math.max(1,lead));
  let name = ''; try{ name = decodeURIComponent(n||''); }catch(e){}
  const pd = (D.risk.baselines.some(b => b.id===d) || /^c\d{1,4}$/.test(d||'')) ? d : S.pd;
  const my = {}; String(y||'').split('.').forEach(e => { const nw = e.includes('_'), [code, a1, a2] = e.split(nw ? '_' : '-'), id = FROM_CODE[code]; if(!id || byId(id).components) return; const p = byId(id), m = {};
    if(nw){ const ld = parseInt(a1, 10)/10, rr = parseInt(a2, 10); if(a1 !== '' && isFinite(ld) && Math.abs(ld) <= 400) m.ld = ld; if(a2 !== '' && isFinite(rr) && Math.abs(rr) <= 700) m.rr = rr/1000; }
    else { const L = parseInt(a1,10), Rr = parseInt(a2,10); if(L >= 0 && L < LEAD_S.length && L !== leadIdx(menuNet(p, S.lam).central)) m.ld = LEAD_S[L].d; if(Rr >= 0 && Rr < RISK_S.length && p.risk && Rr !== riskIdx(p.risk.central)) m.rr = RISK_S[Rr].r; }
    if(m.ld != null || m.rr != null) my[id] = m; });
  const kn = {}; String(kk||'').split('.').forEach(e => { const [code, ps, ee, aa] = e.split('_'), id = FROM_CODE[code]; if(!id) return; const o = {};
    const pos = String(ps||'').split('-').map(x => x === '' ? null : Math.max(0, Math.min(60, parseInt(x,10)))/10); if(pos.some(x => x != null && isFinite(x))) o.k = pos.map(x => x != null && isFinite(x) ? x : null);
    const E = parseInt(ee,10), A = parseInt(aa,10); if(isFinite(E) && E >= 0 && E <= 100) o.e = E/100; if(isFinite(A) && A >= 0 && A <= 100) o.a = A/100; if(Object.keys(o).length) kn[id] = o; });
  let pw = null; const wv = String(ww||'').split('-').map(x => parseInt(x,10)); if(wv.length === D.risk.pathways.length && wv.every(x => isFinite(x) && x >= 0 && x <= 100)) pw = Object.fromEntries(D.risk.pathways.map((x, i) => [x.id, wv[i]]));
  return { ids: normalize(ids), lam, lead, name: cleanName(name), pd, my, kn, pw }; }

  const step = now => { const k = Math.min(1,(now-t0)/520), e = 1-Math.pow(1-k,3); el.textContent = f(from+(to-from)*e); if(k<1) el._raf = requestAnimationFrame(step); };

  all('[data-jump]', b => { const t = v.querySelector('#' + b.dataset.jump); if(!t) return; const d = t.querySelector('details.kfold'); if(d && !d.open) d.open = true; t.scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth', block: 'start' }); });
  const liveOut = id => { const p = byId(id), a = v.querySelector('[data-kout="'+id+':lead"]'), b = v.querySelector('[data-kout="'+id+':risk"]'); if(a) a.textContent = leadOut(p); if(b) b.textContent = riskOut(p); updateBalance(); };
  v.querySelectorAll('input[data-knob]').forEach(el => { const id = el.dataset.knob, i = +el.dataset.i, p = byId(id), ks = knobsFor(p); let st0 = null;
    el.addEventListener('pointerdown', () => { st0 = stateNow(); });
    el.addEventListener('input', () => { const k = Object.assign({}, S.kn[id]); const arr = (k.k || []).slice(); while(arr.length < ks.length) arr.push(null); arr[i] = +el.value/10; k.k = arr; S.kn[id] = k;
      const lab = v.querySelector('[data-kv="'+id+':'+i+'"]'); if(lab) lab.textContent = fmtKnob(ks[i], valueAt(ks[i], +el.value/10)); el.setAttribute('aria-valuetext', fmtKnob(ks[i], valueAt(ks[i], +el.value/10))); liveOut(id); });
    el.addEventListener('change', () => { save(); queueSend(id); render(true); toast('Using your assumptions'); if(st0){ moment(st0, stateNow()); st0 = null; } }); });
  v.querySelectorAll('input[data-rk]').forEach(el => { const id = el.dataset.rk, key = el.dataset.k; let st0 = null;
    el.addEventListener('pointerdown', () => { st0 = stateNow(); });
    el.addEventListener('input', () => { S.kn[id] = Object.assign({}, S.kn[id], { [key]: +el.value/100 }); const lab = v.querySelector('[data-rv="'+id+':'+key+'"]'); if(lab) lab.textContent = el.value + '%'; liveOut(id); });
    el.addEventListener('change', () => { save(); queueSend(id); render(true); toast('Using your assumptions'); if(st0){ moment(st0, stateNow()); st0 = null; } }); });
  one('#rmNext', () => { const id = RM.q[RM.i]; if(!(RM.touched[id+'ld'] && RM.touched[id+'rr'])) return; save(); RM.got.push(id); RM.i++; render(); window.scrollTo({top:0}); });
  one('#rmSkip', () => { RM.i++; render(); window.scrollTo({top:0}); });
  one('#rmAgain', () => { rmStart(); render(); window.scrollTo({top:0}); });
  all('[data-harm]', b => { S.harm = b.dataset.harm || null; save(); render(true); });
  all('[data-share]', b => { if(ordering) logOrder(); shareNative(SHARES[b.dataset.share]); });
  all('[data-copylink]', b => { if(ordering) logOrder(); copy(SHARES[b.dataset.copylink].url, 'Link copied'); });
  all('[data-img]', async b => { if(ordering) logOrder(); const o = SHARES[b.dataset.img]; b.disabled = true; try{ await saveCanvas(await o.img(), o.file||'ai-safety-menu.png'); } finally { b.disabled = false; } });
  one('#dismiss', () => { S.onboarded = true; save(); render(true); });
  one('#adjust', openAdjust);
  one('#clearCart', () => { S.cart = []; save(); location.hash = '#/'; });
  one('#fedit', openFilter);
  one('#fclear', () => { S.q = ''; S.sort = 'shuffle'; S.harm = null; S.bills = false; save(); render(true); syncFab(); });
  one('#fclear2', () => { S.q = ''; render(true); if(!$('#fpanel').hidden) refreshFilter(); });
  one('#lockIn', () => { if(S.cart.length){ location.hash = '#/results'; } });
  one('#printPos', () => window.print());
  one('#csvPos', () => saveFile('ai-safety-menu-my-numbers.csv', numbersCsv(), 'text/csv'));
  one('#openAssume', () => openAdjust());
  const pn = v.querySelector('#posName'); if(pn) pn.addEventListener('change', () => { S.name = cleanName(pn.value); save(); render(true); });
  one('#startFrom', () => { if(!VS.shared) return; S.cart = VS.shared.ids.slice(); S.pd = VS.shared.pd; S.my = Object.assign({}, VS.shared.my); S.kn = Object.assign({}, VS.shared.kn); S.pw = VS.shared.pw; S.onboarded = true; save(); location.hash = '#/'; toast('Their order is yours now'); });
  const al = v.querySelector('#aLead'); if(al) al.addEventListener('input', () => { S.lead = +al.value; save(); v.querySelector('#aLeadV').textContent = S.lead + ' mo'; });
  const nm = v.querySelector('#orderName'); if(nm) nm.addEventListener('change', () => { S.name = cleanName(nm.value); save(); render(true); });

  if((r.name==='policy' ? v.id==='view' : r.name==='m' && v.id==='drBody') && S.my[r.arg] && D.api_base && !RT.crowd[r.arg]) fetch(D.api_base.replace(/\/$/,'') + '/ratings?id=' + encodeURIComponent(r.arg)).then(x => x.ok ? x.json() : null).then(c => { if(c && c.l){ RT.crowd[r.arg] = c; render(true); } }).catch(() => {});
}
/* ---------- rule drawer ---------- */
// #/m/<id> is the menu with that rule open over it. Wide screens dock it beside the menu so both stay usable;
// narrower screens get an overlay (a bottom sheet on phones) with its own running totals.
const DR = { id: null, fromMenu: false, t: null };
const docked = () => !!(window.matchMedia && matchMedia('(min-width:1100px)').matches);
function drawRule(r){ const dr = $('#dr'), b = $('#drBody'), open = r.name === 'm' && !!byId(r.arg);
  if(!open){ if(DR.id){ const was = DR.id, hadFocus = dr.contains(document.activeElement); DR.id = null; dr.classList.remove('open'); document.body.classList.remove('dr-docked'); document.documentElement.classList.remove('dr-lock');
      clearTimeout(DR.t); DR.t = setTimeout(() => { if(!DR.id){ dr.hidden = true; b.innerHTML = ''; } }, REDUCED ? 0 : 280);
      const back = $('#view').querySelector('.item a.info[href="#/m/'+was+'"]'); if(back && (hadFocus || document.activeElement === document.body)) back.focus({ preventScroll: true }); }
    return; }
  const same = DR.id === r.arg, top = same ? b.scrollTop : 0, fresh = !dr.classList.contains('open'), dk = docked();
  clearTimeout(DR.t); b.innerHTML = viewPolicy(r.arg, { drawer: true }); b.scrollTop = top; DR.id = r.arg;
  $('#drFull').href = '#/policy/' + r.arg; $('#drP').setAttribute('aria-modal', dk ? 'false' : 'true');
  document.body.classList.toggle('dr-docked', dk); document.documentElement.classList.toggle('dr-lock', !dk);
  dr.hidden = false; if(fresh){ void dr.offsetWidth; dr.classList.add('open'); $('#drP').focus({ preventScroll: true }); }
  if(!same && dk){ const c = $('#view').querySelector('[data-open="'+r.arg+'"]'); if(c){ const it = c.closest('.item'), rc = it.getBoundingClientRect(); if(rc.top < 90 || rc.bottom > window.innerHeight) it.scrollIntoView({ block: 'center' }); } } }
// Close: step back if the menu opened it, so the back button and the close button agree.
function closeRule(){ if(route().name !== 'm') return; if(DR.fromMenu) history.back(); else { history.replaceState(null, '', '#/'); PREV = route(); render(true); } }
// Switching rules while the drawer is open replaces the entry instead of stacking history.
function openRule(href){ if(route().name === 'm'){ history.replaceState(null, '', href); PREV = route(); render(true); } else location.hash = href; }
document.addEventListener('click', e => { if(e.defaultPrevented || e.button || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || !e.target.closest) return;
  const art = e.target.closest('[data-open]'); if(art){ e.preventDefault(); openRule('#/m/' + art.dataset.open); return; }
  const a = e.target.closest('a[href^="#/m/"]'); if(a && route().name === 'm'){ e.preventDefault(); openRule(a.getAttribute('href')); } });
$('#drX').addEventListener('click', closeRule);
$('#drBg').addEventListener('click', closeRule);
document.addEventListener('keydown', e => { if(e.key === 'Escape' && route().name === 'm' && $('#fpanel').hidden) closeRule(); });
// Keep keyboard focus inside the overlay while it covers the menu.
$('#drP').addEventListener('keydown', e => { if(e.key !== 'Tab' || docked()) return;
  const f = [...$('#drP').querySelectorAll('a[href],button:not([disabled]),input,textarea,select,summary')].filter(x => x.offsetParent !== null); if(!f.length) return;
  const a = f[0], z = f[f.length-1], cur = document.activeElement;
  if(e.shiftKey && (cur === a || cur === $('#drP'))){ e.preventDefault(); z.focus(); } else if(!e.shiftKey && cur === z){ e.preventDefault(); a.focus(); } });
// Phones: drag the sheet's top bar down to close it.
(() => { const bar = $('#drBar'), pnl = $('#drP'); let y0 = null, dy = 0, t0 = 0;
  bar.addEventListener('pointerdown', e => { if(!matchMedia('(max-width:640px)').matches || e.target.closest('a,button')) return; y0 = e.clientY; dy = 0; t0 = performance.now(); pnl.style.transition = 'none'; try { bar.setPointerCapture(e.pointerId); } catch(err){} });
  bar.addEventListener('pointermove', e => { if(y0 == null) return; dy = Math.max(0, e.clientY - y0); pnl.style.transform = 'translateY('+dy+'px)'; });
  const end = () => { if(y0 == null) return; y0 = null; pnl.style.transition = ''; pnl.style.transform = ''; if(dy > 110 || (dy > 40 && dy / Math.max(1, performance.now() - t0) > 0.6)) closeRule(); };
  bar.addEventListener('pointerup', end); bar.addEventListener('pointercancel', end); })();
if(window.matchMedia) matchMedia('(min-width:1100px)').addEventListener('change', () => { if(route().name === 'm') render(true); });
// Opening or closing a rule over the menu keeps your place; leaving the menu and coming back returns you to where you were.
let PREV = route(), MENU_Y = null;
window.addEventListener('hashchange', () => { const r = route(), was = PREV; PREV = r; closeAdjust();
  if(menuish(r.name) && menuish(was.name)){ DR.fromMenu = r.name === 'm' && (was.name === 'menu' || DR.fromMenu); render(true); return; }
  if(menuish(was.name)) MENU_Y = window.scrollY; DR.fromMenu = false; render();
  window.scrollTo({ top: menuish(r.name) && MENU_Y != null ? MENU_Y : 0 }); });
if(!location.hash || location.hash==='#' || location.hash==='#/menu') history.replaceState(null, '', '#/');
render(); loadStats();
if(location.hostname==='localhost') window.__menuDebug = { typeCanvas, S, net, menuNet, riskOf, cutOf, totals, byId, knobsFor, leadDelta };
})();
