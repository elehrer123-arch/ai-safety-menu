<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The AI Safety Menu</title>
<meta name="description" content="You have 213 days of lead over China. Spend them on AI safety.">
<meta property="og:title" content="The AI Safety Menu">
<meta property="og:description" content="You have 213 days of lead over China. Spend them on AI safety.">
<meta name="twitter:card" content="summary_large_image">
<meta property="og:image" content="https://elehrer123-arch.github.io/ai-safety-menu/og/default.png">
<meta property="og:url" content="https://elehrer123-arch.github.io/ai-safety-menu/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&family=Source+Serif+4:ital,opsz,wght@1,8..60,400&display=swap">
<style>
:root{
  --paper:#F6F3EC; --paper-2:#ECE7DC; --card:#FFFFFF; --ink:#1B1A17; --ink-2:#55514A; --ink-3:#8A857B; --rule:#DDD6C8;
  --cost:#C0392B; --gain:#1E7A45; --free:#8A857B; --risk:#6B4FA0;
  --t-free:#E3EBDD; --t-release:#F6E3B4; --t-train:#F4D0C8; --t-china:#D3E2F2;
  --d-free:#3F6B45; --d-release:#8A5A00; --d-train:#A3281E; --d-china:#1F4E86;
  --bar:#1B1A17; --bar-ink:#F6F3EC; --bar-2:#A39E92; --road:#3A3730; --road-line:#6E685D;
  --us:#2B4C8C; --us-ink:#FFFFFF; --cn:#C8261D; --cn-ink:#F7D046;
  --accent:#C0392B; --accent-ink:#FFFFFF; --tilemix:100%;
  --receipt:#FFFFFF; --receipt-ink:#141414;
  --shadow:0 1px 2px rgba(0,0,0,.06), 0 8px 22px rgba(0,0,0,.07);
  --display:"Big Shoulders Display",Impact,"Arial Narrow",sans-serif;
  --sans:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",Menlo,Consolas,monospace;
  --serif:"Source Serif 4",Georgia,serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141613; --paper-2:#1C1F1B; --card:#20241F; --ink:#EEEAE0; --ink-2:#BEB8AB; --ink-3:#8C877C; --rule:#343831;
    --cost:#F0796B; --gain:#6FCB8F; --free:#8C877C; --risk:#B9A3F0;
    --t-free:#2A3A2C; --t-release:#43381B; --t-train:#4A2723; --t-china:#1F3247;
    --d-free:#A8D3AE; --d-release:#F1CD73; --d-train:#F4A195; --d-china:#9CC3EE;
    --bar:#0B0C0A; --bar-ink:#EEEAE0; --bar-2:#8C877C; --road:#2A2D28; --road-line:#4E534B;
    --us:#5B82CF; --cn:#E0463B; --accent:#F0796B; --accent-ink:#141613; --tilemix:32%;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --paper:#141613; --paper-2:#1C1F1B; --card:#20241F; --ink:#EEEAE0; --ink-2:#BEB8AB; --ink-3:#8C877C; --rule:#343831;
  --cost:#F0796B; --gain:#6FCB8F; --free:#8C877C; --risk:#B9A3F0;
  --t-free:#2A3A2C; --t-release:#43381B; --t-train:#4A2723; --t-china:#1F3247;
  --d-free:#A8D3AE; --d-release:#F1CD73; --d-train:#F4A195; --d-china:#9CC3EE;
  --bar:#0B0C0A; --bar-ink:#EEEAE0; --bar-2:#8C877C; --road:#2A2D28; --road-line:#4E534B;
  --us:#5B82CF; --cn:#E0463B; --accent:#F0796B; --accent-ink:#141613; --tilemix:32%;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--paper);color:var(--ink)}
body{margin:0;font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:900;line-height:1;margin:0;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.wrap{max-width:1120px;margin:0 auto;padding-inline:20px}
@media (max-width:480px){.wrap{padding-inline:16px}}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.cost{color:var(--cost)} .gain{color:var(--gain)} .free{color:var(--free)}
.muted{color:var(--ink-3);font-size:.88rem}

/* header + hero + balance */
.top{background:var(--card);border-bottom:1px solid var(--rule)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px}
.brand{font-family:var(--display);font-weight:900;font-size:1.5rem;text-transform:uppercase;text-decoration:none;line-height:1}
.brand span{color:var(--accent)}
.toplink{font-weight:600;font-size:.92rem;color:var(--ink-2);text-decoration:none}
.toplink:hover{color:var(--ink)}
.hero{background:var(--card)}
.hero-in{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding-block:30px 28px}
.hero-ico{width:112px;height:112px;border-radius:50%;background:var(--paper-2);display:grid;place-items:center}
.hero-ico svg{width:84px;height:84px}
.hero h1{font-size:clamp(2.4rem,6.4vw,3.8rem)}
.hero p{margin:0;color:var(--ink-2);font-size:1.05rem;max-width:44em;text-wrap:balance}
.bal{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--us);color:#fff;transition:background .35s}
.bal.up{background:#1E7A45}.bal.down{background:#A3281E}
.bal .wrap{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding-block:14px}
.bal-c{display:flex;align-items:baseline;justify-content:center;gap:10px;flex-wrap:wrap}
.bal-v{font-family:var(--display);font-weight:900;font-size:clamp(2.3rem,5.4vw,3.2rem);line-height:1;font-variant-numeric:tabular-nums}
.bal-s{font-weight:600;font-size:1.02rem;opacity:.9}
#balR{justify-self:end}
.bal-btn{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:.88rem;text-decoration:none;border:1.5px solid rgba(255,255,255,.65);border-radius:999px;padding:6px 14px;color:#fff;background:none;white-space:nowrap}
@media (max-width:640px){.bal .wrap{grid-template-columns:1fr;padding-block:10px}.bal .wrap>span:first-child{display:none}.bal-s{font-size:.9rem}#balR{display:none}}
.meter{height:12px;background:rgba(255,255,255,.25);border-radius:999px;overflow:hidden}
.meter i{display:block;height:100%;background:#fff;border-radius:999px;transition:width .4s}

/* race */
.race{position:relative;height:34px}
.race .road{position:absolute;left:0;right:0;top:12px;height:10px;border-radius:999px;background:var(--road)}
.race .road::after{content:"";position:absolute;left:8px;right:8px;top:4px;height:2px;background:repeating-linear-gradient(90deg,var(--road-line) 0 8px,transparent 8px 16px)}
.race .rn{position:absolute;top:3px;width:28px;height:28px;margin-left:-14px;border-radius:50%;display:grid;place-items:center;font-size:.64rem;font-weight:700;letter-spacing:.02em;transition:left .6s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 0 2px var(--bar)}
.race .rn.us{background:var(--us);color:var(--us-ink);z-index:2}
.race .rn.cn{background:var(--cn);color:var(--cn-ink);z-index:1}
.race .rn.ghost{background:transparent;border:2px dashed var(--bar-2);box-shadow:none;opacity:.6}
.rcpt .race .road{background:#e6e2d8}.rcpt .race .road::after{background:repeating-linear-gradient(90deg,#b8b2a4 0 8px,transparent 8px 16px)}
.rcpt .race .rn{box-shadow:0 0 0 2px #fff}.rcpt .race .rn.ghost{border-color:#aaa}
@media (prefers-reduced-motion:reduce){.race .rn,.meter i,.bal-v{transition:none}}

/* layout */
main{padding-block:26px 72px;min-width:0}
.head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:10px 20px;margin-bottom:14px}
.head h1{font-size:clamp(1.9rem,4.4vw,3rem)}
.head p{margin:6px 0 0;color:var(--ink-2);max-width:52ch}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* worldview */
.wv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 16px;align-items:center;background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:10px 12px;margin:0 0 14px}
.wv-q{font-weight:600;font-size:.9rem;max-width:15em;line-height:1.25}
.wv-q button{background:none;border:0;padding:0;color:var(--ink-3);text-decoration:underline;font-size:.8rem;font-weight:500}
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:var(--paper-2);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;border-radius:8px;padding:6px 6px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.78rem;font-weight:600;color:var(--ink-2);line-height:1.15;text-align:center}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.pips{display:flex;gap:3px}
.pips i{width:9px;height:9px;border-radius:2px;background:var(--rule)}
.pips i.f{background:var(--cn)}
@media (max-width:640px){.wv{grid-template-columns:1fr}.wv-q{max-width:none}.seg button{font-size:.7rem}}

/* famous orders */
.pills{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px 8px;scrollbar-width:thin}
.pill{flex:none;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--rule);background:var(--card);border-radius:999px;padding:7px 8px 7px 14px;font-weight:600;font-size:.88rem}
.pill .tg{font-size:.78rem;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--paper-2)}
.pill:hover{border-color:var(--ink)}
.lbl{font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:18px 0 8px}

/* legend */
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.8rem;color:var(--ink-2);margin:4px 0 10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px}

/* rigor details (detail and backup pages only) */
.facts{background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:14px 18px;margin-top:12px}
.facts p{margin:8px 0 0;max-width:70ch}
.basis{font-size:.74rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 10px}
.b-partial{background:var(--t-free);color:var(--d-free)}.b-estimate{background:var(--t-release);color:var(--d-release)}
.alts{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;margin-top:8px;font-size:.88rem}
.alt{background:var(--paper-2);border-radius:8px;padding:2px 8px}.alt.on{outline:2px solid var(--us)}
.sec2{font-size:.72rem;font-weight:700;background:var(--t-release);color:var(--d-release);border-radius:6px;padding:1px 6px}
.note-unpriced{background:var(--card);border:1px dashed var(--ink-3);border-radius:12px;padding:10px 14px;color:var(--ink-2);max-width:70ch}
ul.plain{margin:8px 0 0;padding-left:20px}ul.plain li{margin-bottom:6px;color:var(--ink-2)}
.per{display:block;font-family:var(--sans);font-weight:600;font-size:.7rem;color:var(--ink-3);letter-spacing:.02em}
/* illustrations */
.art{display:grid;place-items:center;background:color-mix(in srgb, var(--tb, var(--paper-2)) var(--tilemix), var(--card));border-radius:12px;color:var(--us)}
.art svg{width:64%;height:64%}
.art.hd{width:96px;height:96px;border-radius:20px}.art.hd svg{width:72px;height:72px}
.art.wide{height:150px;border-radius:0}.art.wide svg{width:110px;height:110px}
.art.sm{width:60px;height:60px;flex:none;border-radius:14px}.art.sm svg{width:44px;height:44px}
.art.xs{width:26px;height:26px;border-radius:7px;margin-left:-6px}.art.xs svg{width:22px;height:22px}
.pill{padding-left:10px}
.face{position:relative;display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--paper);overflow:hidden;flex:none;font-weight:700;font-size:.8rem}
.face::before{content:attr(data-ini)}
.face img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.face.lg{width:76px;height:76px;font-size:1.2rem;margin-bottom:14px}
.qc .who{display:flex;align-items:center;gap:10px}
.qc .who b{display:block;color:var(--ink);font-size:.9rem}
/* items */
.tile{display:grid;place-items:center;background:var(--paper-2);color:var(--us)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
@media (max-width:560px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.item{position:relative;background:var(--card);border-radius:14px;padding:0 14px 14px;overflow:hidden;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;border:2px solid transparent;box-shadow:var(--shadow);min-width:0}
.item.on{border-color:var(--us)}
.ico{width:84px;height:84px;border-radius:50%;background:var(--paper-2);display:grid;place-items:center;color:var(--ink);margin-bottom:8px;transition:background .2s,color .2s}
.ico svg{width:42px;height:42px}
.item.on .ico{background:var(--us);color:#fff}
.item>.art{height:132px;margin:0 -14px 12px;border-radius:0;align-self:stretch}.item>.art svg{width:92px;height:92px}
.item.on>.art{box-shadow:inset 0 -4px 0 var(--us)}
.iname{font-weight:700;font-size:1.06rem;line-height:1.2;min-height:2.4em;display:flex;align-items:center;justify-content:center}
.iprice{font-family:var(--display);font-weight:900;font-size:1.55rem;line-height:1.1;color:var(--us)}
.iprice.gain{color:var(--gain)}
.ibtns{display:grid;grid-template-columns:1fr 1.25fr;gap:8px;width:100%;margin-top:12px}
.ibtns button{border:0;border-radius:8px;padding:10px 4px;font-weight:700;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b-rm{background:var(--paper-2);color:var(--ink-3)}
.b-rm:not([disabled]){background:#F2D3CE;color:#8A2219}
.b-add{background:var(--us);color:#fff}
.b-add[disabled]{background:var(--paper-2);color:var(--ink-2)}
.ibtns button[disabled]{cursor:default}
.info{position:absolute;top:10px;right:10px;z-index:1;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.9);color:#1B1A17!important;color:var(--ink-2);display:grid;place-items:center;text-decoration:none;font-family:var(--serif);font-style:italic;font-weight:600;font-size:.92rem}
.info:hover{background:var(--ink);color:var(--paper)}
@media (max-width:560px){.item{padding:0 10px 10px}.item>.art{height:104px;margin:0 -10px 10px}.item>.art svg{width:72px;height:72px}.ico{width:64px;height:64px}.ico svg{width:32px;height:32px}.iname{font-size:.94rem}.iprice{font-size:1.3rem}.ibtns{gap:6px}.ibtns button{font-size:.82rem;padding:9px 2px}}
.sec{font-size:clamp(1.5rem,3.4vw,2rem);text-align:center;margin:44px 0 4px}
.sub{text-align:center;color:var(--ink-3);margin:0 0 16px}
.billpills{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:14px}
.more{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:14px}
.mc{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:14px;padding:16px;text-decoration:none;box-shadow:var(--shadow)}
.mc .ico{width:56px;height:56px;margin:0;flex:none}.mc .ico svg{width:28px;height:28px}
.mc b{display:block;font-size:1.05rem}.mc span{color:var(--ink-3);font-size:.88rem}
.whatif{margin:0 0 18px}
.whatif p{margin:0 0 8px;font-weight:700}

/* receipt + share */
.rsec{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:28px;align-items:start;margin-top:36px}
.rsec>div{min-width:0}
@media (max-width:820px){.rsec{grid-template-columns:1fr}}
.rcpt{background:var(--receipt);color:var(--receipt-ink);font-family:var(--mono);font-size:.82rem;line-height:1.45;padding:22px 20px 30px;box-shadow:var(--shadow);width:100%;max-width:400px;
  -webkit-mask:radial-gradient(circle at 8px 0,transparent 6px,#000 6.5px) 0 0/16px 51% repeat-x,radial-gradient(circle at 8px 100%,transparent 6px,#000 6.5px) 0 100%/16px 51% repeat-x;
          mask:radial-gradient(circle at 8px 0,transparent 6px,#000 6.5px) 0 0/16px 51% repeat-x,radial-gradient(circle at 8px 100%,transparent 6px,#000 6.5px) 0 100%/16px 51% repeat-x}
.rcpt .r-h{font-family:var(--display);font-weight:900;font-size:1.8rem;text-align:center;text-transform:uppercase;line-height:1}
.rcpt .r-c{text-align:center;color:#666;font-size:.7rem}
.rcpt .r-m{display:flex;justify-content:space-between;gap:8px;font-size:.7rem;color:#666}
.rcpt .r-name{display:flex;justify-content:center;align-items:baseline;gap:6px;margin:8px 0 2px;font-weight:600;text-transform:uppercase}
.rcpt .r-name input{border:0;border-bottom:1.5px dashed #999;background:transparent;font-family:var(--mono);font-weight:600;text-transform:uppercase;width:11em;padding:0 2px;color:#141414}
.rcpt .r-name input::placeholder{color:#aaa}
.rcpt .r-rule{border-top:1.5px dashed #aaa;margin:8px 0}
.rcpt .r-rule.dbl{border-top:3px double #111}
.rcpt .r-l{display:flex;justify-content:space-between;gap:10px}
.rcpt .r-l span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.rcpt .r-l span:last-child{white-space:nowrap}
.rcpt .r-g{color:#1E7A45}
.rcpt .r-big{font-family:var(--display);font-weight:900;font-size:1.6rem;text-transform:uppercase}
.rcpt .r-note{font-size:.68rem;color:#666;text-align:center;margin-top:6px;text-transform:uppercase}
.rcpt .race{margin:12px 4px 2px}
.barcode{display:flex;justify-content:center;height:36px;margin:10px 0 4px}
.barcode i{display:block;background:#141414}
.share h2{font-size:1.8rem;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:.95rem;padding:10px 18px;border-radius:999px;border:1.5px solid var(--ink);background:transparent;text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.dark{background:var(--ink);color:var(--paper)}
.btn[disabled]{opacity:.4;cursor:default}
.links{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:12px;font-size:.88rem}
.links a,.links button{background:none;border:0;padding:0;color:var(--ink-2);text-decoration:underline;font-weight:500}

/* bar rows (charts) */
.bars{display:grid;gap:4px}
.br{display:grid;grid-template-columns:minmax(0,15em) minmax(0,1fr) 5.5em;gap:10px;align-items:center;min-height:26px}
.br .l{font-size:.86rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:none}
a.l:hover{text-decoration:underline}
.br .p{position:relative;height:18px}
.br .z{position:absolute;top:-4px;bottom:-4px;width:1.5px;background:var(--ink-3)}
.br .b{position:absolute;top:3px;height:12px;border-radius:3px;transition:left .5s,width .5s}
.br .b.cost{background:var(--cost)}.br .b.gain{background:var(--gain)}.br .b.ink{background:var(--ink)}.br .b.soft{background:var(--ink-3)}
.br .b.gap{background:var(--us)}.br .b.eval{background:var(--d-release)}.br .b.pace{background:var(--ink-3)}
.br .b.mkt{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.5) 0 3px,transparent 3px 6px)}
.br .d{position:absolute;top:2px;width:14px;height:14px;margin-left:-7px;border-radius:50%;transition:left .5s}
.br .d.me{background:var(--ink)}.br .d.them{background:var(--card);border:2.5px solid var(--cn)}
.br .ln{position:absolute;top:8px;height:2px;background:var(--ink-3);transition:left .5s,width .5s}
.br .v{font-family:var(--display);font-weight:900;font-size:1.05rem;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.br.hl .l{color:var(--ink)}.br.hl{background:var(--paper-2);border-radius:6px}
.br.tot .l{font-weight:700}.br.tot{border-top:1.5px solid var(--ink);padding-top:4px;margin-top:2px}
.bars.wide .br{grid-template-columns:minmax(0,14em) minmax(0,1fr) 9.5em}

<script>
(function(){
'use strict';
const D = window.MENU_DATA;
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ALL = D.policies.concat(D.combos);
const byId = id => ALL.find(p => p.id===id);
const FROM_CODE = {}; Object.keys(D.codes).forEach(id => FROM_CODE[D.codes[id]] = id);
const DPM = 30.44, Z = {low:0,central:0,high:0};
const REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const defaultLam = (D.stances.find(s=>s.id===D.default_stance)||{lam:.5}).lam;
const SHORT = { own:'Not at all', some:'A little', lot:'A lot', most:'Mostly' };
const RK = window.MENU_RISK, HARMS = D.risk.harms;

/* ---------- state ---------- */
const S = { lam: defaultLam, lead: 7, cart: [], name: '', hook: null, onboarded: false, pd: D.risk.default_baseline, harm: null };
function load(k, d){ try{ const v = localStorage.getItem('menu2.'+k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } }
function store(k, v){ try{ localStorage.setItem('menu2.'+k, JSON.stringify(v)); }catch(e){} }
(function(){ const c = load('cart', []); if(Array.isArray(c)) S.cart = c.filter(byId);
  const l = load('lam', null); if(typeof l==='number' && l>=0 && l<=1) S.lam = l;
  const m = load('lead', null); if(typeof m==='number' && m>=1 && m<=18) S.lead = m;
  const pd = load('pd', null); if(D.risk.baselines.some(b => b.id===pd)) S.pd = pd; const hm = load('harm', null); if(HARMS[hm]) S.harm = hm;
  S.name = String(load('name','')||'').slice(0,24); S.hook = load('hook', null); S.onboarded = !!load('onboarded', false); })();
function save(){ store('pd',S.pd); store('harm',S.harm); store('cart',S.cart); store('lam',S.lam); store('lead',S.lead); store('name',S.name); store('hook',S.hook); store('onboarded',S.onboarded); }

/* ---------- pricing ---------- */
// Cost to America's lead = delay to U.S. frontier − share copied × delay to China's access − direct slowdown to China
function net(p, lam){ const u=p.d_us, a=p.d_access, c=p.d_china||Z; return { low: u.low - lam*a.high - c.high, central: u.central - lam*a.central - c.central, high: u.high - lam*a.low - c.low }; }
function totals(ids, lam){ const t = {gross:0,disc:0,credit:0,net:0,low:0,high:0}; ids.map(byId).filter(Boolean).forEach(p => { t.gross += p.d_us.central; t.disc += lam*p.d_access.central; t.credit += (p.d_china||Z).central; const n = net(p,lam); t.low += n.low; t.high += n.high; }); // Security measures share one theft budget, so ordering several cannot remove more theft risk than exists.
  const th = ids.map(byId).filter(p => p && p.theft_cut);

function rateRows(id, d, ours, hideOurs){ const row = (label, opts, key, sel, our) => '<div class="rrow"><b>'+label+'</b><div class="rpills'+(hideOurs?' hide-ours':'')+'" role="group" aria-label="'+esc(label)+'">' + opts.map((l,i) => '<button data-rate="'+id+'" data-k="'+key+'" data-v="'+i+'" aria-pressed="'+(sel===i)+'" class="'+(i===our?'ours':'')+'">'+esc(l)+'</button>').join('') + '</div></div>';
  return row('Cost to America\'s lead', LEAD_B, 'l', d.l, ours.l) + row('Effect on p(doom)', RISK_B, 'r', d.r, ours.r); }
const oursOf = p => ({ l: leadBucket(net(p, S.lam).central), r: riskBucket(riskOf(p)) });
function crowdLine(c){ if(!c) return ''; const top = (arr, names) => { const n = arr.reduce((a,b)=>a+b,0); if(!n) return null; const i = arr.indexOf(Math.max.apply(null, arr)); return [names[i], Math.round(100*arr[i]/n), n]; };
  const a = top(c.l, LEAD_B), b = top(c.r, RISK_B), xa = top(c.xl, LEAD_B), xb = top(c.xr, RISK_B); if(!a) return '';
  return '<div class="crowd">Most players say <b>'+esc(a[0])+'</b> ('+a[1]+'%) and <b>'+esc(b[0])+'</b> ('+b[1]+'%), from '+a[2].toLocaleString('en-US')+(a[2]===1?' rating':' ratings')+'.' + (xa && xa[2] >= 5 ? ' People in AI policy or safety say <b>'+esc(xa[0])+'</b> and <b>'+esc(xb[0])+'</b> ('+xa[2]+').' : '') + '</div>'; }
async function sendRating(id, d){ RT.mine[id] = { l: d.l, r: d.r, t: Date.now() }; store('rated', RT.mine);
  const res = await api('rate', { id, lead: d.l, risk: d.r, expert: RT.expert, reason: d.why || '' }); if(res && res.l) RT.crowd[id] = res; return res; }

/* ---------- view: challenge ---------- */
const CH = { picks: load('ch', []).filter(byId), done: false };
const chPool = () => D.policies.filter(p => D.challenge.sections.includes(p.section));
const chPrice = p => net(p, D.challenge.lam).central;
const chBudget = () => D.challenge.budget_days / DPM;
const chWords = () => D.challenge.budget_days >= 28 ? 'one month' : D.challenge.budget_days >= 14 ? 'two weeks' : 'one week';
const chTitle = () => { const w = chWords(); return w.charAt(0).toUpperCase() + w.slice(1).replace(' ', '-') + ' challenge'; };
const chSpent = () => CH.picks.map(byId).reduce((a,p) => a + chPrice(p), 0);
const chCredit = () => CH.picks.map(byId).reduce((a,p) => a + Math.max(0, -chPrice(p)), 0);
const chCanAdd = p => chPrice(p) <= chBudget() - chSpent() + 1e-9;
let CH_BEST = null;
const chBest = () => CH_BEST || (CH_BEST = RK.best(chPool(), chBudget()*DPM, p => chPrice(p)*DPM, D));
function chToggle(id, el){ const p = byId(id), i = CH.picks.indexOf(id), d0 = doomAfter(CH.picks);
  if(i >= 0) CH.picks.splice(i,1); else { if(!chCanAdd(p)){ toast("Can't afford that one yet"); return; } CH.picks.push(id); }
  store('ch', CH.picks); const c = chPrice(p) * (i>=0 ? -1 : 1); const dir = c > EPS ? 'down' : c < -EPS ? 'up' : null;
  floatAt(el, Math.abs(c) < EPS ? 'Free' : (c > 0 ? '−' : '+') + fmt(Math.abs(c)), dir); flash(dir);
  const d1 = doomAfter(CH.picks); floatAt(el, doomDelta(d0, d1), 'doom', 36); if(d1 < d0 - 1e-9) pulseDoom();
  render(true); const b = document.querySelector('[data-ch="'+id+'"]'); if(b) b.focus({preventScroll:true}); }
let CH_HIST = null;
function chFinish(){ CH.done = true; CH_HIST = null; api('score', {game:'challenge', score: Math.round(100*Math.max(0, cutOf(CH.picks)))}).then(r => { if(r && r.hist){ CH_HIST = r.hist; render(true); } }); render(); window.scrollTo({top:0}); }
function viewChallenge(){
  if(CH.done) return chResult(CH.picks, true);
  let h = '<div class="head" style="justify-content:center;text-align:center"><div><h1>'+chWords().charAt(0).toUpperCase()+chWords().slice(1)+' of lead. How low can you get p(doom)?</h1><p>Pass rules until the lead runs out. Rules that do similar things overlap, so the biggest cuts don\'t simply add up.</p></div></div>';
  h += '<div class="grid">' + shuffled(chPool()).map(p => card(p, {lam: D.challenge.lam, picked: CH.picks, canAdd: chCanAdd})).join('') + '</div>';
  return h + '<div class="row" style="margin-top:20px"><button class="btn primary" id="chFinish2">See my score</button>' + (CH.picks.length ? '<button class="btn" id="chReset">Start over</button>' : '') + '</div>';
}
function chResult(picks, mine){
  const n = picks.length, cut = cutOf(picks), best = chBest().cut, p0 = P0(), score = Math.round(100*Math.max(0,cut)), pct = mine && CH_HIST ? percentile(CH_HIST, score) : null;
  const top = cut >= best - 0.0005, pc = RK.pct(Math.max(0,cut)), bp = RK.pct(best);

    img: () => cardCanvas({kicker:chTitle(), big: pc, line:'of the risk of AI catastrophe removed for '+chWords()+' of America\'s lead.', sub:'p(doom) '+fmtP(p0)+' to '+fmtP(p0*(1-cut))+'. '+n+(n===1?' rule':' rules')+' passed.'}), file: chTitle().toLowerCase().replace(/\s+/g,'-')+'.png' }, '<button id="chAgain">Play again</button>');
}

/* ---------- view: chart (rankings + disagreement) ---------- */
function scatterHTML(){
  const W = 760, H = 440, L = 58, Rm = 20, T = 18, B = 50, list = D.policies.filter(p => p.risk);
  const sx = d => Math.sign(d)*Math.log10(1+Math.abs(d)), X0 = sx(-60), X1 = sx(200), sy = v => Math.sign(v)*Math.sqrt(Math.abs(v)), Y0 = sy(-12), Y1 = sy(50);
  const X = d => L + (W-L-Rm)*(sx(Math.max(-60, Math.min(200, d)))-X0)/(X1-X0), Y = r => T + (H-T-B)*(1-(sy(Math.max(-12, Math.min(50, r)))-Y0)/(Y1-Y0));
  let g = '<rect x="'+X(-60)+'" y="'+T+'" width="'+(X(1)-X(-60))+'" height="'+(Y(3)-T)+'" fill="var(--gain)" opacity=".07"/>';
  g += '<text class="q" x="'+(X(-60)+8)+'" y="'+(T+20)+'">Bargains</text><text class="q" x="'+(W-Rm-8)+'" y="'+(Y(-3.5))+'" text-anchor="end">Costly, little protection</text>';
  const placed = [], dots = [];
  [[-60,'+2 mo'],[-30,'+1 mo'],[-7,'+1 wk'],[-1,'+1 day'],[0,'0'],[1,'1 day'],[7,'1 wk'],[30,'1 mo'],[90,'3 mo'],[180,'6 mo']].forEach(([d,l]) => { g += '<line class="'+(d===0?'zero':'ax')+'" x1="'+X(d)+'" x2="'+X(d)+'" y1="'+T+'" y2="'+(H-B)+'"/><text x="'+X(d)+'" y="'+(H-B+18)+'" text-anchor="middle" font-size="12">'+l+'</text>'; });
  [-10,-5,0,5,10,20,40].forEach(v => { g += '<line class="'+(v===0?'zero':'ax')+'" x1="'+L+'" x2="'+(W-Rm)+'" y1="'+Y(v)+'" y2="'+Y(v)+'"/><text x="'+(L-8)+'" y="'+(Y(v)+4)+'" text-anchor="end" font-size="12">'+(v>0?'−':v<0?'+':'')+Math.abs(v)+'%</text>'; });
  g += '<text x="'+((L+W-Rm)/2)+'" y="'+(H-10)+'" text-anchor="middle" font-size="13" font-weight="700">Cost to America\'s lead →</text><text transform="translate(16 '+((T+H-B)/2)+') rotate(-90)" text-anchor="middle" font-size="13" font-weight="700">p(doom) change ↓ is better</text>';
  list.forEach(p => { const d = net(p, S.lam).central*DPM; dots.push([X(d), Y(riskOf(p)*100)]); });
  // Place a label beside its dot, trying both sides and small nudges; skip it if every spot collides.
  const spot = (x, y, text) => { const w = text.length*6.4 + 4, h = 14;
    for(const [dx, dy, left] of [[10,0,0],[-10,0,1],[10,-13,0],[10,13,0],[-10,-13,1],[-10,13,1]]){ const x0 = left ? x+dx-w : x+dx, y0 = y+dy-10;
      if(x0 < L || x0+w > W-Rm || y0 < T || y0+h > H-B) continue;
      if(placed.some(b => x0 < b[0]+b[2] && b[0] < x0+w && y0 < b[1]+b[3] && b[1] < y0+h)) continue;
      if(dots.some(([px,py]) => px > x0-3 && px < x0+w+3 && py > y0-3 && py < y0+h+3 && !(Math.abs(px-x)<1 && Math.abs(py-y)<1))) continue;
      placed.push([x0, y0, w, h]); return {x: left ? x+dx : x+dx, y: y+dy+4, anchor: left ? 'end' : 'start'}; }
    return null; };
  list.forEach(p => { const d = net(p, S.lam).central*DPM, r = riskOf(p)*100, x = X(d), y = Y(r), on = S.cart.includes(p.id);
    const col = r > 0.05 ? 'var(--risk)' : r < -0.05 ? 'var(--cost)' : 'var(--free)', big = Math.abs(r) >= 4.5 || Math.abs(d) >= 20 || r <= -2.5;
    g += '<a href="#/policy/'+p.id+'"><title>'+esc(nameOf(p)+': '+priceText(d/DPM)+' of lead, '+riskHead(r/100).toLowerCase())+'</title><circle class="dot" cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+(on?8:6)+'" fill="'+col+'"'+(on?' stroke="var(--ink)" stroke-width="2.5"':'')+'/>' +
      (() => { const at = big && spot(x, y, nameOf(p)); return at ? '<text x="'+at.x.toFixed(1)+'" y="'+at.y.toFixed(1)+'" font-size="12" text-anchor="'+at.anchor+'">'+esc(nameOf(p))+'</text>' : ''; })() + '</a>'; });
  return '<div class="scat"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Each rule plotted by its cost to America\'s lead and its effect on p(doom)">'+g+'</svg></div>'; }
function viewChart(arg){
  if(arg != null && VS.arg !== arg){ VS.arg = arg; VS.them = Math.min(100, Math.max(0, parseInt(arg,10)||0))/100; VS.fromLink = true; }
  const me = S.lam, them = VS.them;
  const items = D.policies.slice().sort((a,b) => net(b,me).central - net(a,me).central);
  const rows = items.map(p => { const a = net(p,me).central, b = them!=null ? net(p,them).central : null; return {label:p.name, href:'#/policy/'+p.id, to:a, to2:b, val: b!=null ? eff(a)+' / '+eff(b) : eff(a), vcls: b!=null ? '' : effCls(a), mkt:p.market_price}; });
  const split = them!=null ? rows.filter(r => (r.to > 0.25) !== (r.to2 > 0.25) || Math.abs(r.to - r.to2) >= 0.25).length : 0;
  let h = '<div class="head"><div><h1>The whole menu, to scale</h1><p>'+(VS.fromLink && them!=null ? 'Someone sent you their worldview: '+esc(stanceLabel(them))+'. Where do you stand?' : 'Each bar is what a rule costs America\'s lead.')+'</p></div></div>';
  h += '<div class="panel"><h3>Cost vs. protection</h3><p class="muted" style="margin:0 0 10px">Across: what a rule costs America\'s lead. Up: how much of the risk of AI catastrophe it removes. The bargains sit top left. Tap a dot for the details.</p>' + scatterHTML() + '</div>';
  h += '<h2 class="sec">Lead cost, to scale</h2><div class="wv"><div class="wv-q">You think</div>'+seg(me,'data-lam')+'</div>';
  h += '<div class="wv"><div class="wv-q">Compare with</div>'+seg(them,'data-them','<button data-them="none" aria-pressed="'+(them==null)+'"><span class="pips"></span>Nobody</button>')+'</div>';
  if(them != null) h += '<div class="result"><div class="score" style="font-size:clamp(3.5rem,10vw,5.5rem)">'+split+'<small>/'+rows.length+'</small></div><p><b>Rules you two price differently.</b> Every split comes from one belief: how much China copies U.S. models.</p></div>';
  h += '<div class="panel">' + (them!=null ? '<div class="legend"><span><i style="background:var(--ink);border-radius:50%"></i>You</span><span><i style="border:2.5px solid var(--cn);border-radius:50%"></i>'+esc(stanceLabel(them))+'</span></div>' : '') + barRows(rows, {axis:'costs lead →', wide: them!=null}) + '</div>';
  const title = them!=null ? split+' of '+rows.length+' rules' : 'The whole menu', sub = them!=null ? 'priced differently by two worldviews' : stanceLabel(me);
  h += '<div style="margin-top:14px">' + shareBtns({ title:'The AI Safety Menu chart', text: them!=null ? 'We price '+split+' of '+rows.length+' AI safety rules differently, and it all comes down to one belief. Where do you stand?' : 'Every AI safety rule, priced in America\'s lead over China, on one chart.', url: shareUrl(them!=null ? 'vs/'+Math.round(me*100) : 'chart'),
    img: () => chartCanvas(rows, title, sub), file:'ai-safety-menu-chart.png' }) + '</div>';
  return h;
}

/* ---------- view: assumptions ---------- */
function viewAssumptions(){
  const partial = ALL.filter(p => p.basis === 'partial').map(p => nameOf(p));
  let h = '<div class="dt"><a class="back" href="#/method">← How it works</a><div class="head"><div><h1>What this assumes</h1><p>Every price rests on the six assumptions below. You can change the first two and the last, and every number updates.</p></div></div>';
  h += '<section class="panel"><h3>1. How much China depends on U.S. models</h3><p class="lead">The key unknown: how much China\'s progress slows when U.S. models are held back or slowed. Chinese labs learn from U.S. models through distillation, published research and hired staff. "A little" is the central estimate from the simulation model behind these prices. "A lot" doubles it and "mostly" triples it. The site starts at "not at all," the least favourable case for safety rules.</p><div style="margin-top:12px">' + seg(S.lam, 'data-lam') + '</div></section>';
  h += '<section class="panel"><h3>2. America\'s lead: '+S.lead+' months</h3><p class="lead">'+esc(D.lead_note)+'</p><div class="slider"><span>Lead in months</span><b id="aLeadV">'+S.lead+' mo</b><input type="range" id="aLead" min="1" max="18" step="1" value="'+S.lead+'" aria-label="America\'s lead in months"></div></section>';
  h += '<section class="panel"><h3>3. Two prices, estimated separately</h3><p class="lead">Each rule has two prices: what it costs America\'s lead, and how much it lowers p(doom). Neither is folded into the other. Not counted:</p><ul class="plain"><li>Whether a smaller U.S. lead itself changes the risk. Some argue it raises risk because less careful labs could take the lead. Others argue a big lead only fuels the race. The site leaves that trade to you.</li><li>Lab revenue, investment and market share.</li><li>Researchers or companies moving abroad.</li><li>The cost of complying with many different state laws at once.</li></ul></section>';
  h += '<section class="panel"><h3>4. One horizon, simple sums</h3><ul class="plain"><li>Every price is the change in the U.S.–China gap 12 months after a rule takes effect. A pause costs more while it lasts; labs partly catch up afterward.</li><li>An order adds up its items. Adding a real bill replaces its parts, so a bill is not counted twice. Two separate bills can still overlap.</li><li>Security measures share one theft risk, set by the model at about three days of lead a year. Measures ordered together cannot remove more than all of it.</li><li>Staff time counts only through the research it displaces. That is why most paperwork rules cost under a day.</li></ul></section>';
  h += '<section class="panel" id="basis"><h3>5. Most numbers are assumptions</h3><p class="lead">No price here is directly measured. Every rule page says which kind it is.</p><ul class="plain"><li><b>Modeled:</b> 35 rules and bills come from a simulation of U.S. and Chinese AI progress, calibrated to published data on compute, training runs and model releases. Most policy-specific inputs are stated assumptions. <a href="'+AP+'appendix/index.html" target="_blank" rel="noopener">Technical appendix</a></li><li><b>Partly sourced</b> and <b>Our estimate:</b> the 17 newer items, priced by hand on the same logic.</li></ul></section>';
  const G = D.risk.groups;
  h += '<section class="panel" id="risk"><h3>6. How p(doom) works here</h3><p class="lead">p(doom) is the chance that AI causes a catastrophe as bad as human extinction. Nobody knows it. Pick whose estimate to start from:</p><div style="margin-top:12px">' + pdSeg() + '</div>' +
    '<ul class="plain" style="margin-top:12px">' + D.risk.baselines.map(b => '<li><b>'+esc(b.short)+', '+esc(b.label)+':</b> '+esc(b.who)+' <a href="'+esc(b.url)+'" target="_blank" rel="noopener">'+esc(b.source)+'</a>'+(b.url2 ? ' · <a href="'+esc(b.url2)+'" target="_blank" rel="noopener">'+esc(b.source2)+'</a>' : '')+'</li>').join('') + '</ul>' +
    '<p>The four estimates answer slightly different questions, so treat them as rough anchors.</p><ul class="plain"><li>Each rule removes a share of whatever risk is left, so rules multiply rather than add. U.S. rules alone remove at most about half the risk, because most of the rest sits outside U.S. law. Deals with China can remove far more, if they hold.</li>' +
    '<li>Rules that do similar things overlap. Together they can remove at most: ' + Object.keys(G).map(k => esc(G[k].label)+' '+RK.pct(G[k].cap)).join(', ') + '.</li>' +
    '<li>Each rule\'s share is our judgment in coarse steps: tiny is about 1%, small about 3%, medium about 5 to 8%, large 10% or more. Expert surveys such as <a href="'+esc(D.risk.expert_survey.url)+'" target="_blank" rel="noopener">'+esc(D.risk.expert_survey.title)+'</a> show which practices experts favour, not how much each one lowers the risk. Nobody has measured that.</li>' +
    '<li>Lead costs are measured 12 months after a rule takes effect. Risk cuts are the lasting effect of keeping the rule.</li><li>A few non-safety items add risk, like removing state safety laws or a government race to build the most powerful AI.</li></ul></section>';
  return h + '</div>';
}

/* ---------- view: method ---------- */
function viewMethod(){
  let h = '<div class="head"><div><h1>How it works</h1><p>Every rule has two prices. The first, what it costs America\'s lead, is one equation measured 12 months after a rule takes effect. The second is how much it lowers p(doom), the chance of an AI catastrophe. You choose the numbers nobody knows. Assumptions: <a href="#/assumptions">What this assumes</a>. Every input and calculation: <a href="'+AP+'appendix/index.html" target="_blank" rel="noopener"><b>Technical appendix</b></a>. Think a number is wrong? <a href="#/rate"><b>Rate ten rules</b></a>.</p></div></div>';
  h += '<div class="panel"><h3>The equation</h3><div class="eq"><span class="a">Delay to the U.S.</span><em>−</em><span class="b">China\'s dependence on U.S. models × delay to China\'s access</span><em>−</em><span class="c">Direct slowdown to China</span><em>=</em><span class="r">Cost to the lead</span></div></div>';
  h += '<div class="panel"><h3>Which clock does a rule stop?</h3><div class="pipe"><div class="clk yes"><b>Training</b><span>Costs real lead, though labs partly catch up afterward.</span></div><div class="clk cond"><b>Internal use</b><span>Costs only what the newest model would have added.</span></div><div class="clk no"><b>Public release</b><span>Delays China\'s access too. Can even gain lead.</span></div></div></div>';
  const an = D.anchors.filter(a => a.days).slice().sort((a,b)=>b.days-a.days);
  h += '<div class="panel"><h3>Time, to scale</h3><div class="legend"><span><i style="background:var(--us)"></i>Gaps between frontiers</span><span><i style="background:var(--d-release)"></i>Evaluation and release windows</span><span><i style="background:var(--ink-3)"></i>Pace of progress</span></div>' +
    barRows(an.map(a => ({label:a.short||a.label, to:a.days, cls:a.kind, val: a.days>=60 ? (Math.round(a.days/DPM*10)/10)+' mo' : a.days+' d'})), {lo:0}) + '<p class="muted" style="margin:10px 0 0">Evaluation windows are days. The gap is months.</p></div>';
  h += '<div class="panel"><h3>The second price: p(doom)</h3><div class="eq"><span class="a">Starting p(doom)</span><em>×</em><span class="b">share of the risk left after every rule you pick</span><em>=</em><span class="r">Your p(doom)</span></div><p class="muted" style="margin:10px 0 0">Rules that do similar things overlap, so their cuts shrink when combined. Details and sources: <a href="#/assumptions">What this assumes</a>.</p></div>';
  const acc = (t, body) => '<details class="acc"><summary>'+esc(t)+'</summary>'+body+'</details>';
  h += '<div style="margin-top:18px">';
  h += acc('The model\'s principles', '<p>Prices come from a simulation model. Its full write-up, inputs and per-rule calculations are in the <a href="'+AP+'appendix/index.html" target="_blank" rel="noopener">technical appendix</a>. The appendix counts a positive number as closing the U.S. lead; its central case matches the "a little" setting here.</p><ol>'+D.rubric.map(r => '<li><b>'+esc(r.rule)+'</b> '+esc(r.charge)+'</li>').join('')+'</ol>');
  h += acc('Why seven months', '<p>'+esc(D.lead_note)+'</p>');
  h += acc('Sources for the scale', '<ul>'+D.anchors.map(a => '<li><a href="'+esc(a.url)+'" target="_blank" rel="noopener">'+esc(a.source)+'</a>: '+esc(a.label)+', '+esc(a.value)+'</li>').join('')+'</ul>');
  h += acc('How the games score', '<ul><li>The menu adds up the items you pick. A bill replaces its parts.</li><li>Your ending depends on where your order lands on the map of lead against p(doom). There is no best spot: racing, braking and dealing with China are all on the map.</li><li>Player ratings are counted anonymously. Written reasons are read by the team and never shown on the site. We revise numbers by hand and log every change.</li><li>The challenge scores the share of p(doom) you remove with one month of lead, assuming China doesn\'t depend on U.S. models. The best score shown is the best combination our search found.</li><li>The quiz assumes China doesn\'t depend on U.S. models, so everyone answers the same question.</li>'+(D.api_base?'<li>Crowd numbers are anonymous counts.</li>':'')+'</ul>');
  h += acc('What this is not', '<ul><li>Not a cost in dollars. Expensive rules can cost zero lead.</li><li>Not a measurement. The lead costs come from a model with stated assumptions. The p(doom) cuts are coarse judgments. Both are there to argue with.</li></ul>');
  h += acc('Changelog and data', '<ul>'+D.changelog.map(c => '<li>'+esc(c.date)+': '+esc(c.note)+'</li>').join('')+'</ul><p><a href="menu.csv" target="_blank" rel="noopener">Download the spreadsheet</a> · '+dispute()+'</p>');
  return h + '</div>';
}

/* ---------- router ---------- */
function route(){ const h = (location.hash||'#/').replace(/^#\/?/,''); const i = h.indexOf('/'); const name = i<0 ? h : h.slice(0,i), arg = i<0 ? undefined : h.slice(i+1);
  const alias = { '':'menu', spend:'menu', combos:'menu', claims:'quotes', claim:'quote', compare:'chart', rankings:'chart' }; return { name: alias[name]!=null ? alias[name] : name, arg }; }
const TAB = { menu:'#/', policy:'#/', receipt:'#/', o:'#/', challenge:'#/challenge', c:'#/challenge', quiz:'#/quiz', quotes:'#/quotes', quote:'#/quotes', chart:'#/chart', vs:'#/chart', method:'#/method', assumptions:'#/method', rate:'#/method' };
function render(keep){
  const r = route(); SHARES = {}; let html;
  switch(r.name){
    case 'policy': html = viewPolicy(r.arg); break;
    case 'receipt': html = viewReceipt(); break;
    case 'o': html = viewShared(r.arg); break;
    case 'challenge': html = viewChallenge(); break;
    case 'c': html = chResult([...new Set((r.arg && r.arg!=='-' ? r.arg.split('.') : []).map(x=>FROM_CODE[x]).filter(id => id && chPool().some(p=>p.id===id)))], false); break;
    case 'quiz': html = viewQuiz(); break;
    case 'quotes': html = viewQuotes(); break;
    case 'quote': html = viewQuote(r.arg); break;
    case 'chart': if(r.arg==null && VS.fromLink){ VS.fromLink = false; } html = viewChart(); break;
    case 'vs': html = viewChart(r.arg); break;
    case 'method': html = viewMethod(); break;
    case 'assumptions': html = viewAssumptions(); break;
    case 'rate': html = viewRate(); break;
    default: html = viewMenu();
  }
  $('#hero').hidden = r.name !== 'menu'; if(!$('#heroArt').firstChild && ART._hero) $('#heroArt').innerHTML = ART._hero.svg;
  $('#heroP').textContent = 'Each rule costs some of America\'s lead over China' + (S.lam > 0.001 ? ' (if ' + stanceLabel(S.lam) + ')' : '') + ' and lowers p(doom), the chance of an AI catastrophe. How low can you get it?';
  const y = window.scrollY; $('#view').innerHTML = html; if(keep) window.scrollTo(0, y);
  document.querySelectorAll('#tabs a').forEach(a => a.classList.toggle('on', a.getAttribute('href') === (TAB[r.name]||'#/')));
  bind(r); updateBalance(); $('#ver').textContent = 'v' + D.version + ' · ' + D.updated;
}
function bind(r){
  const v = $('#view'), all = (s, f) => v.querySelectorAll(s).forEach(e => e.addEventListener('click', () => f(e))), one = (s, f) => { const e = v.querySelector(s); if(e) e.addEventListener('click', f); };
  const ordering = r.name==='menu' || r.name==='receipt';
  all('[data-add]', b => toggle(b.dataset.add, b));
  all('[data-ch]', b => chToggle(b.dataset.ch, b));
  all('[data-preset]', b => loadPreset(b.dataset.preset));
  all('[data-lam]', b => setLam(+b.dataset.lam));
  all('[data-pd]', b => setPd(b.dataset.pd));
  all('[data-rate]', b => { const k = b.dataset.rate; RT.draft[k] = Object.assign(RT.draft[k] || {}, { [b.dataset.k]: +b.dataset.v }); render(true); });
  v.querySelectorAll('[data-why]').forEach(t => t.addEventListener('input', () => { const k = t.dataset.why; RT.draft[k] = Object.assign(RT.draft[k] || {}, { why: t.value }); }));
  v.querySelectorAll('[data-expert]').forEach(c => c.addEventListener('change', () => { RT.expert = c.checked; store('expert', RT.expert); }));
  all('[data-send]', async b => { const id = b.dataset.send, d = RT.draft[id]; if(!d || d.l==null || d.r==null) return; b.disabled = true; await sendRating(id, d); delete RT.draft[id]; toast(D.api_base ? 'Thanks. Rating sent.' : 'Saved on this device'); render(true); });
  all('[data-rerate]', b => { const id = b.dataset.rerate, m = RT.mine[id]; RT.draft[id] = { l: m.l, r: m.r }; render(true); });
  one('#rmNext', async () => { const id = RM.q[RM.i], d = RT.draft['rm:'+id]; if(!d || d.l==null || d.r==null) return; RM.got.push({ id, l: d.l, r: d.r }); sendRating(id, d); delete RT.draft['rm:'+id]; RM.i++; render(); window.scrollTo({top:0}); });
  one('#rmSkip', () => { RM.i++; render(); window.scrollTo({top:0}); });
  one('#rmAgain', () => { rmStart(); render(); window.scrollTo({top:0}); });
  all('[data-harm]', b => { S.harm = b.dataset.harm || null; save(); render(true); });
  all('[data-them]', b => { VS.them = b.dataset.them==='none' ? null : +b.dataset.them; render(true); });
  all('[data-share]', b => { if(ordering) logOrder(); shareNative(SHARES[b.dataset.share]); });
  all('[data-copylink]', b => { if(ordering) logOrder(); copy(SHARES[b.dataset.copylink].url, 'Link copied'); });
  all('[data-img]', async b => { if(ordering) logOrder(); const o = SHARES[b.dataset.img]; b.disabled = true; try{ await saveCanvas(await o.img(), o.file||'ai-safety-menu.png'); } finally { b.disabled = false; } });
  all('[data-hook]', b => { S.hook = +b.dataset.hook; save(); api('guess', {q:'hook', b:S.hook}).then(res => { if(res && res.counts){ HOOK_CROWD = res.counts; render(true); } }); render(true); });
  all('[data-q]', b => { const i = +b.dataset.q, id = D.quiz[Q.i]; Q.answers[Q.i] = i; if(i === bucketOf(net(byId(id),QUIZ_LAM).central)) Q.score++; api('guess', {q:id, b:i}).then(res => { if(res && res.counts){ Q.crowd[id] = res.counts; render(true); } }); render(true); });
  one('#dismiss', () => { S.onboarded = true; save(); render(true); });
  one('#adjust', openAdjust);
  one('#nextQ', () => { Q.i++; if(Q.i >= D.quiz.length) api('score', {game:'quiz', score:Q.score}).then(res => { if(res && res.hist){ Q.final = res.hist; render(true); } }); render(); window.scrollTo({top:0}); });
  one('#againQuiz', () => { Q.i = 0; Q.score = 0; Q.answers = []; Q.final = null; render(); });
  one('#chFinish2', chFinish);
  one('#chReset', () => { CH.picks = []; store('ch', []); render(true); });
  one('#chAgain', () => { CH.done = false; CH.picks = []; store('ch', []); render(); window.scrollTo({top:0}); });
  one('#clearCart', () => { const before = totals(S.cart,S.lam).net; S.cart = []; save(); flash(before>EPS?'up':before<-EPS?'down':null); render(true); });
  one('#copyText', () => { logOrder(); copy(receiptText()); });
  one('#startFrom', () => { if(!VS.shared) return; S.cart = VS.shared.ids.slice(); S.pd = VS.shared.pd; S.onboarded = true; save(); location.hash = '#/'; toast('Their order is yours now'); });
  const al = v.querySelector('#aLead'); if(al) al.addEventListener('input', () => { S.lead = +al.value; save(); v.querySelector('#aLeadV').textContent = S.lead + ' mo'; });
  const nm = v.querySelector('#orderName'); if(nm) nm.addEventListener('change', () => { S.name = cleanName(nm.value); save(); render(true); });
  if(r.name==='receipt') logOrder();
  if(r.name==='policy' && RT.mine[r.arg] && D.api_base && !RT.crowd[r.arg]) fetch(D.api_base.replace(/\/$/,'') + '/ratings?id=' + encodeURIComponent(r.arg)).then(x => x.ok ? x.json() : null).then(c => { if(c && c.l){ RT.crowd[r.arg] = c; render(true); } }).catch(() => {});
}
window.addEventListener('hashchange', () => { closeAdjust(); if(route().name!=='challenge') CH.done = false; render(); window.scrollTo({top:0}); });
if(!location.hash || location.hash==='#' || location.hash==='#/menu') history.replaceState(null, '', '#/');
render(); loadStats();
if(location.hostname==='localhost') window.__menuDebug = { receiptCanvas, cardCanvas, chartCanvas, typeCanvas, S };
})();
</script>
